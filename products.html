<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتجات - الأنسياب المتقدم | أدوات ولوازم الغاز والرحلات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- هيدر الصفحة -->
  <header>
    <div class="container header-content">
      <div class="logo">
        <h1>الأنسياب المتقدم</h1>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">الرئيسية</a></li>
          <li><a href="products.html" class="active">المنتجات</a></li>
          <li><a href="about.html">من نحن</a></li>
          <li><a href="contact.html">اتصل بنا</a></li>
        </ul>
      </nav>
      <div class="cart-icon" onclick="openCartModal()">
        🛒 سلة الطلبات (<span id="cart-badge">0</span>)
      </div>
    </div>
  </header>

  <!-- محتوى صفحة المنتجات -->
  <main class="container">
    <section class="products-section">
      <h2>قائمة المنتجات</h2>
      
      <!-- تصفية الفئات (يمكن تخصيصها حسب الفئات المتاحة) -->
      <div class="categories-filter">
        <button class="filter-btn active" onclick="filterCategory('all')">الكل</button>
        <button class="filter-btn" onclick="filterCategory('dawayir')">دوافير الغاز</button>
        <button class="filter-btn" onclick="filterCategory('mowaqid')">مواقد الغاز</button>
        <button class="filter-btn" onclick="filterCategory('rihlat')">لوازم الرحلات</button>
        <button class="filter-btn" onclick="filterCategory('defayat')">دفايات</button>
      </div>

      <!-- شبكة المنتجات -->
      <div class="products-grid" id="products-grid">
        <!-- يتم تعبئة المنتجات ديناميكياً أو إضافتها يدوياً هنا -->
        <div class="product-card" data-category="dawayir">
          <h3>دافور غاز رحلات</h3>
          <p>منتج عالي الجودة وممتاز للكشتات والرحلات البرية.</p>
          <button onclick="addToCart('دافور غاز رحلات', 1, 'حبة')">إضافة للسلة</button>
        </div>
        <div class="product-card" data-category="mowaqid">
          <h3>موقد غاز عينين</h3>
          <p>موقد عملي وقوي لتحمل الاستخدام الشاق.</p>
          <button onclick="addToCart('موقد غاز عينين', 1, 'حبة')">إضافة للسلة</button>
        </div>
      </div>
    </section>
  </main>

  <!-- نافذة سلة المشتريات المنبثقة (Modal) -->
  <div id="cart-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('cart-modal')">&times;</span>
      <h2>سلة طلباتك</h2>
      <div id="cart-items-container">
        <!-- عناصر السلة تظهر هنا -->
      </div>
      <div class="cart-actions">
        <button onclick="sendCartToWhatsApp()" class="whatsapp-btn">إرسال الطلب عبر الواتساب</button>
      </div>
    </div>
  </div>

  <!-- فوتر الموقع -->
  <footer>
    <div class="container">
      <p>جميع الحقوق محفوظة &copy; الأنسياب المتقدم 2026</p>
    </div>
  </footer>

  <!-- كود الجافاسكريبت المتكامل -->
  <script>
    let cart = JSON.parse(localStorage.getItem('ansiyab_cart')) || [];

    // تحديث شارة السلة عند التحميل
    updateCartBadge();

    function addToCart(name, qty, unit) {
      let existingItem = cart.find(item => item.name === name);
      if (existingItem) {
        existingItem.qty += qty;
      } else {
        cart.push({ name: name, qty: qty, unit: unit });
      }
      localStorage.setItem('ansiyab_cart', JSON.stringify(cart));
      updateCartBadge();
      alert("تمت إضافة المنتج إلى السلة بنجاح!");
    }

    function updateCartBadge() {
      let badge = document.getElementById('cart-badge');
      if (badge) {
        let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        badge.innerText = totalQty;
      }
    }

    function openCartModal() {
      let modal = document.getElementById('cart-modal');
      let container = document.getElementById('cart-items-container');
      container.innerHTML = "";

      if (cart.length === 0) {
        container.innerHTML = "<p>السلة فارغة حالياً.</p>";
      } else {
        let listHtml = "<ul style='list-style: none; padding: 0;'>";
        cart.forEach((item, index) => {
          listHtml += `<li style="margin-bottom: 10px; border-bottom: 1px solid #ddd; padding-bottom: 5px;">
            <strong>${item.name}</strong> - الكمية: ${item.qty} ${item.unit}
            <button onclick="removeFromCart(${index})" style="float: left; background: red; color: white; border: none; padding: 2px 5px; cursor: pointer;">حذف</button>
          </li>`;
        });
        listHtml += "</ul>";
        container.innerHTML = listHtml;
      }
      modal.style.display = 'block';
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem('ansiyab_cart', JSON.stringify(cart));
      updateCartBadge();
      openCartModal();
    }

    function sendCartToWhatsApp() {
      if (cart.length === 0) {
        alert("قائمة الطلب فارغة!");
        return;
      }
      let text = "السلام عليكم، أود طلب المنتجات التالية من الأنسياب المتقدم:\n\n";
      cart.forEach((item, index) => {
        text += `${index + 1}. ${item.name} - الكمية: ${item.qty} ${item.unit}\n`;
      });
      let encoded = encodeURIComponent(text);
      window.open(`https://wa.me/966500000000?text=${encoded}`, '_blank');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    function filterCategory(category) {
      let cards = document.querySelectorAll('.product-card');
      let buttons = document.querySelectorAll('.filter-btn');
      
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      cards.forEach(card => {
        if (category === 'all' || card.getAttribute('data-category') === category) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
