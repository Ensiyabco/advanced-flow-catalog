<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتجات والأقسام | الأنسياب المتقدم</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    /* شريط المشرف - مخفي تماماً بشكل افتراضي ولا يظهر إلا عند تفعيل وضع الإدارة */
    .admin-bar {
      display: none;
      background: #1b365d;
      color: white;
      padding: 10px 20px;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      border-bottom: 2px solid #2b6cb0;
    }

    body.admin-mode .admin-bar {
      display: flex;
    }

    .admin-bar-btns {
      display: flex;
      gap: 10px;
    }

    .admin-action-btn {
      background: #d69e2e;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .admin-action-btn:hover {
      opacity: 0.9;
    }

    .shop-layout {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    /* الشريط الجانبي للأقسام */
    .sidebar-categories {
      width: 300px;
      flex-shrink: 0;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      height: fit-content;
    }

    .sidebar-btn-all {
      background: #e53e3e;
      color: white;
      width: 100%;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 10px;
      text-align: center;
    }

    .main-cat-item {
      border-bottom: 1px solid #edf2f7;
      margin-bottom: 5px;
    }

    .main-cat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #f8fafc;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      color: #1b365d;
      font-size: 14px;
      transition: background 0.2s;
    }

    .main-cat-header:hover {
      background: #edf2f7;
    }

    /* تنسيق قائمة الأقسام الفرعية */
    .sub-cat-list {
      display: none;
      padding: 6px 10px 6px 5px;
      background: #fff;
    }

    .sub-cat-list.active {
      display: block;
    }

    .sub-cat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border-bottom: 1px dashed #f1f5f9;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .sub-cat-row:hover {
      background: #f8fafc;
    }

    .sub-cat-item {
      font-size: 13px;
      color: #4a5568;
      cursor: pointer;
      flex-grow: 1;
      font-weight: 600;
    }

    .sub-cat-item:hover, .sub-cat-item.active {
      color: #3182ce;
      font-weight: 800;
    }

    /* أدوات المشرف للأقسام الفرعية - مخفية تماماً افتراضياً */
    .admin-sub-tools, 
    .admin-main-tools, 
    #add-subcat-section {
      display: none !important;
    }

    body.admin-mode .admin-sub-tools,
    body.admin-mode .admin-main-tools,
    body.admin-mode #add-subcat-section {
      display: inline-flex !important;
    }

    body.admin-mode div#add-subcat-section {
      display: block !important;
    }

    /* منطقة المنتجات */
    .products-content-area {
      flex: 1;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 15px;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-card img {
      width: 100%;
      height: 160px;
      object-fit: contain;
      background: #f8fafc;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .product-card h3 {
      font-size: 15px;
      color: #1b365d;
      margin: 0 0 5px 0;
      font-weight: 800;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      border-top: 1px solid #edf2f7;
      padding-top: 8px;
    }

    .details-btn {
      background: #2b6cb0;
      color: white;
      text-decoration: none;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .shop-layout {
        flex-direction: column;
      }
      .sidebar-categories {
        width: 100%;
      }
    }
  </style>
</head>
<body id="page-body">

  <!-- شريط مميزات المشرف العلوي (مخفي للعملاء تماماً) -->
  <div class="admin-bar" id="admin-bar-container">
    <span id="admin-status-text">⚠️ أنت في وضع إدارة الموقع (اضغط خروج للإخفاء)</span>
    <div class="admin-bar-btns">
      <button class="admin-action-btn" onclick="addNewMainCategory()">+ إضافة قسم رئيسي</button>
      <button class="admin-action-btn" onclick="addNewProductPage()">+ إضافة منتج جديد</button>
      <button class="admin-action-btn" style="background:#e53e3e;" onclick="toggleAdminMode()">تسجيل الخروج</button>
    </div>
  </div>

  <header>
    <a href="index.html" class="logo-container">
      <img src="assets/images/logo.png" alt="شعار المؤسسة" id="logo-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100%\' height=\'100%\' fill=\'%23edf2f7\'/><text x=\'50%\' y=\'50%\' font-family=\'Cairo\' font-size=\'14\' fill=\'%23a0aec0\' text-anchor=\'middle\' dominant-baseline=\'middle\'>لا توجد صورة</text></svg>'">
      <div class="brand-title">
        <h1>الأنصياب المتقدم</h1>
        <p>أدوات ولوازم الغاز والرحلات</p>
      </div>
    </a>
    <nav class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="products.html" class="active">المنتجات</a>
      <button class="cart-btn-header" onclick="openCartModal()">
        <span>قائمة الطلب</span>
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </nav>
  </header>

  <div class="main-container">
    <div class="shop-layout">
      
      <!-- الشريط الجانبي للأقسام -->
      <aside class="sidebar-categories">
        <button class="sidebar-btn-all" onclick="filterCategory('all', 'all', this)">عرض كل المنتجات</button>
        
        <div id="sidebar-categories-list">
          <!-- الأقسام الرئيسية والفرعية -->
        </div>

        <div id="add-subcat-section" style="margin-top:12px;">
          <button class="admin-action-btn" style="background:#3182ce; width:100%; justify-content:center;" onclick="addNewSubCategoryModal()">+ إضافة قسم فرعي</button>
        </div>
      </aside>

      <!-- محتوى المنتجات -->
      <main class="products-content-area">
        <h3 id="current-category-title" style="color:#1b365d; font-weight:800; margin-top:0; margin-bottom:15px;">كل المنتجات</h3>
        <div class="products-grid" id="products-grid"></div>
      </main>

    </div>
  </div>

  <!-- مودال السلة -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal-card">
      <h3>قائمة الطلبات الخاصة بك</h3>
      <div id="cart-items-container" style="max-height:300px; overflow-y:auto; margin:15px 0;"></div>
      <div class="modal-actions">
        <button style="background:#25d366; color:#fff;" onclick="sendCartToWhatsApp()">إرسال عبر الواتساب</button>
        <button style="background:#e2e8f0; color:#4a5568;" onclick="closeModal('cart-modal')">إلغاء</button>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 الأنسياب المتقدم - جميع الحقوق محفوظة</p>
  </footer>

  <script>
    const defaultProducts = [
      { id: 1, name: "مسدس لحام إيطالي فاخر", mainCat: "ادوات لحام ووصواريخ بقاعدة", subCat: "مسدسات لحام ايطالي", unit: "حبة", boxQty: 6, stock: 50, images: [] },
      { id: 2, name: "صاروخ ايطالي", mainCat: "ادوات لحام ووصواريخ بقاعدة", subCat: "صواريخ وبقاعدة", unit: "حبة", boxQty: 4, stock: 10, images: [] },
      { id: 3, name: "موقد غاز سفري رحلات", mainCat: "مواقد غاز", subCat: "مواقد رحلات", unit: "حبة", boxQty: 10, stock: 10, images: [] },
      { id: 4, name: "منظم غاز إيطالي منزلي", mainCat: "ساعات ومنظمات غاز", subCat: "ساعات غاز منزليه", unit: "حبة", boxQty: 20, stock: 10, images: [] },
      { id: 5, name: "جالون 10 لتر", mainCat: "ادوات ولوازم الرحلات", subCat: "دواوين وسطول", unit: "حبة", boxQty: 6, stock: 10, images: [] },
      { id: 6, name: "منقل ثقيل", mainCat: "ادوات ولوازم الشواء", subCat: "مناقل شوي", unit: "حبة", boxQty: 2, stock: 10, images: [] }
    ];

    let products = JSON.parse(localStorage.getItem('ansiyab_products_v4')) || defaultProducts;
    let cart = JSON.parse(localStorage.getItem('ansiyab_cart')) || [];
    let isAdmin = localStorage.getItem('ansiyab_admin_mode') === 'true';
    let selectedMainCatForSub = '';

    // تعيين شعار المؤسسة الرسمي كصورة افتراضية أساسية للأصناف التي بلا صورة
    const defaultProductImage = "assets/images/logo.png";

    document.addEventListener('DOMContentLoaded', function() {
      updateAdminModeUI();
      renderSidebarCategories();
      displayProducts(products);
      updateCartBadge();
    });

    function updateAdminModeUI() {
      const body = document.getElementById('page-body');
      if (isAdmin) {
        body.classList.add('admin-mode');
      } else {
        body.classList.remove('admin-mode');
      }
    }

    function toggleAdminMode() {
      isAdmin = !isAdmin;
      localStorage.setItem('ansiyab_admin_mode', isAdmin);
      updateAdminModeUI();
      renderSidebarCategories();
      displayProducts(products);
    }

    function renderSidebarCategories() {
      const container = document.getElementById('sidebar-categories-list');
      const mainCats = [...new Set(products.map(p => p.mainCat))];
      
      let html = '';
      mainCats.forEach((mainCat, index) => {
        const subs = [...new Set(products.filter(p => p.mainCat === mainCat).map(p => p.subCat).filter(Boolean))];
        
        html += `
          <div class="main-cat-item">
            <div class="main-cat-header" onclick="toggleSubMenu(this, '${mainCat}')">
              <span>${mainCat}</span>
              <div style="display:flex; align-items:center; gap:5px;">
                <span class="admin-main-tools" onclick="event.stopPropagation(); editMainCat('${mainCat}')" title="تعديل اسم القسم">✏️</span>
                <span>▼</span>
              </div>
            </div>
            <div class="sub-cat-list" id="sub-list-${index}">
              <div class="sub-cat-row">
                <div class="sub-cat-item" onclick="filterCategory('${mainCat}', 'all', this)">عرض الكل في ${mainCat}</div>
              </div>
        `;
        
        subs.forEach(sub => {
          html += `
            <div class="sub-cat-row">
              <div class="sub-cat-item" onclick="filterCategory('${mainCat}', '${sub}', this)">${sub}</div>
              <div class="admin-sub-tools">
                <button onclick="deleteSubCat('${mainCat}', '${sub}')" style="background:none; border:none; color:#e53e3e; cursor:pointer; font-size:12px;" title="حذف القسم الفرعي">❌</button>
              </div>
            </div>
          `;
        });
        
        html += `
            </div>
          </div>
        `;
      });
      
      container.innerHTML = html;
    }

    function toggleSubMenu(headerElement, mainCat) {
      selectedMainCatForSub = mainCat;
      const subList = headerElement.nextElementSibling;
      const isOpen = subList.classList.contains('active');
      
      document.querySelectorAll('.sub-cat-list').forEach(el => el.classList.remove('active'));
      if (!isOpen) {
        subList.classList.add('active');
      }

      filterCategory(mainCat, 'all', headerElement);
    }

    function filterCategory(mainCat, subCat, element) {
      document.querySelectorAll('.sub-cat-item, .main-cat-header').forEach(el => el.classList.remove('active'));
      if(element) element.classList.add('active');

      let filtered = products;
      let title = "كل المنتجات";

      if (mainCat !== 'all') {
        filtered = filtered.filter(p => p.mainCat === mainCat);
        title = mainCat;
        selectedMainCatForSub = mainCat;
      }

      if (subCat !== 'all') {
        filtered = filtered.filter(p => p.subCat === subCat);
        title = `${mainCat} / ${subCat}`;
      }

      document.getElementById('current-category-title').innerText = title;
      displayProducts(filtered);
    }

    function displayProducts(prodsToDisplay) {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      if (prodsToDisplay.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#718096; padding:30px;">لا توجد منتجات مطابقة حالياً.</p>';
        return;
      }

      prodsToDisplay.forEach(prod => {
        let stockQty = prod.stock !== undefined ? prod.stock : 10;
        let badgeHtml = '';

        if (stockQty > 5) {
          badgeHtml = `<span style="font-size:11px; color:#0288d1; font-weight:700;">متوفر (${stockQty})</span>`;
        } else if (stockQty > 0 && stockQty <= 5) {
          badgeHtml = `<span style="font-size:11px; color:#f57c00; font-weight:700;">عدد محدود (${stockQty})</span>`;
        } else {
          badgeHtml = `<span style="font-size:11px; color:#c62828; font-weight:700;">نفذت الكمية</span>`;
        }

        // استخدام شعار المؤسسة إذا لم تكن هناك صورة مسجلة للمنتج
        let mainImg = (prod.images && prod.images.length > 0 && prod.images[0].trim() !== '') ? prod.images[0] : defaultProductImage;

        let adminProductTools = isAdmin ? `
          <div class="admin-main-tools" style="margin-top:8px; display:flex; gap:5px;">
            <a href="edit-product.html?id=${prod.id}" style="background:#d69e2e; color:#fff; padding:3px 8px; border-radius:4px; font-size:11px; text-decoration:none;">تعديل</a>
            <button onclick="deleteProduct(${prod.id})" style="background:#e53e3e; color:#fff; border:none; padding:3px 8px; border-radius:4px; font-size:11px; cursor:pointer;">حذف</button>
          </div>
        ` : '';

        grid.innerHTML += `
          <div class="product-card">
            <div>
              <img src="${mainImg}" alt="${prod.name}" onerror="this.src='${defaultProductImage}'">
              <div style="font-size:11px; color:#718096; margin-bottom:3px;">${prod.mainCat}</div>
              <h3>${prod.name}</h3>
              ${adminProductTools}
            </div>
            <div>
              <div class="card-footer">
                ${badgeHtml}
                <a href="product.html?id=${prod.id}" class="details-btn">التفاصيل</a>
              </div>
            </div>
          </div>
        `;
      });
    }

    function addNewMainCategory() {
      let name = prompt("أدخل اسم القسم الرئيسي الجديد:");
      if (name && name.trim() !== "") {
        products.push({ id: Date.now(), name: "منتج تجريبي", mainCat: name.trim(), subCat: "عام", unit: "حبة", boxQty: 1, stock: 10, images: [] });
        localStorage.setItem('ansiyab_products_v4', JSON.stringify(products));
        renderSidebarCategories();
        displayProducts(products);
        alert("تم إضافة القسم الرئيسي بنجاح!");
      }
    }

    function addNewSubCategoryModal() {
      if (!selectedMainCatForSub) {
        alert("الرجاء اختيار قسم رئيسي أولاً من القائمة الجانبية لإضافة قسم فرعي تحته.");
        return;
      }
      let subName = prompt(`أدخل اسم القسم الفرعي الجديد تحت (${selectedMainCatForSub}):`);
      if (subName && subName.trim() !== "") {
        products.push({ id: Date.now(), name: "منتج تجريبي", mainCat: selectedMainCatForSub, subCat: subName.trim(), unit: "حبة", boxQty: 1, stock: 10, images: [] });
        localStorage.setItem('ansiyab_products_v4', JSON.stringify(products));
        renderSidebarCategories();
        displayProducts(products);
        alert("تم إضافة القسم الفرعي بنجاح!");
      }
    }

    function addNewProductPage() {
      window.location.href = "add-product.html";
    }

    function deleteProduct(id) {
      if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
        products = products.filter(p => p.id !== id);
        localStorage.setItem('ansiyab_products_v4', JSON.stringify(products));
        renderSidebarCategories();
        displayProducts(products);
      }
    }

    function deleteSubCat(mainCat, subCat) {
      if (confirm(`هل أنت متأكد من حذف القسم الفرعي (${subCat})؟`)) {
        products = products.filter(p => !(p.mainCat === mainCat && p.subCat === subCat));
        localStorage.setItem('ansiyab_products_v4', JSON.stringify(products));
        renderSidebarCategories();
        displayProducts(products);
      }
    }

    function updateCartBadge() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').innerText = totalCount;
    }

    function openCartModal() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = '';
      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#a0aec0;">قائمة الطلب فارغة حالياً</p>';
      } else {
        cart.forEach((item, index) => {
          container.innerHTML += `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #edf2f7;">
              <div>
                <strong>${item.name}</strong><br>
                <small style="color:#718096;">الكمية: ${item.qty} ${item.unit}</small>
              </div>
              <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#e53e3e; cursor:pointer; font-weight:bold;">🗑️</button>
            </div>
          `;
        });
      }
      document.getElementById('cart-modal').style.display = 'flex';
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem('ansiyab_cart', JSON.stringify(cart));
      updateCartBadge();
      openCartModal();
    }

    function sendCartToWhatsApp() {
      if (cart.length === 0) return alert("قائمة الطلب فارغة!");
      let text = "مرحباً، أود طلب المنتجات التالية:\n\n";
      cart.forEach((item, i) => {
        text += `${i+1}- ${item.name} (الكمية: ${item.qty} ${item.unit})\n`;
      });
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }
  </script>
</body>
</html>
