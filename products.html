<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتجات | الأنسياب المتقدم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .page-layout {
      display: flex;
      gap: 20px;
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 15px;
    }
    .main-content-area { flex: 3; }
    .sidebar-area { flex: 1; min-width: 260px; }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      width: 100%;
      box-sizing: border-box;
    }
    .product-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }
    @media (max-width: 768px) {
      .page-layout { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <img src="assets/images/logo.png" alt="شعار المتجر" id="logo-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'50\' height=\'50\'><rect width=\'100%\' height=\'100%\' fill=\'%23edf2f7\'/><text x=\'50%\' y=\'50%\' font-family=\'Cairo\' font-size=\'10\' fill=\'%23a0aec0\' text-anchor=\'middle\' dominant-baseline=\'middle\'>شعار</text></svg>'">
      <div class="brand-title">
        <h1>الأنسياب المتقدم</h1>
        <p>أدوات ولوازم الغاز والرحلات</p>
      </div>
    </a>
    <nav class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="products.html" class="active">المنتجات</a>
      <button class="cart-btn-header" onclick="openCartModal()">
        <span>قائمة الطلب</span>
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </nav>
  </header>

  <div class="page-layout">
    <!-- منطقة المنتجات -->
    <div class="main-content-area">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="color:#1b365d; margin:0; font-weight:900;">كل المنتجات</h2>
        <button onclick="openAddSubCategoryModal()" style="background:#2b6cb0; color:#fff; border:none; padding:8px 14px; border-radius:6px; font-weight:700; cursor:pointer; font-family:'Cairo',sans-serif;">+ إضافة قسم فرعي جديد</button>
      </div>
      <div class="products-grid" id="products-container"></div>
    </div>

    <!-- الشريط الجانبي للأقسام -->
    <div class="sidebar-area">
      <div style="background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:15px; box-shadow:0 4px 6px rgba(0,0,0,0.02);">
        <h3 style="color:#1b365d; margin-top:0; font-size:16px; border-bottom:2px solid #edf2f7; padding-bottom:8px;">الأقسام والتصنيفات</h3>
        <div id="sidebar-categories-container"></div>
      </div>
    </div>
  </div>

  <!-- مودال إضافة قسم فرعي غير موجود -->
  <div class="modal-overlay" id="subcat-modal">
    <div class="modal-card">
      <h3>إضافة قسم فرعي غير موجود</h3>
      <div style="margin-bottom:15px;">
        <label style="display:block; font-size:13px; font-weight:700; margin-bottom:5px;">اختر القسم الرئيسي:</label>
        <select id="modal-main-cat" style="width:100%; padding:8px; border:1px solid #cbd5e0; border-radius:6px; font-family:'Cairo';">
          <option value="ادوات لحام ووصواريخ بقاعدة">ادوات لحام ووصواريخ بقاعدة</option>
          <option value="مواقد غاز">مواقد غاز</option>
          <option value="ساعات ومنظمات غاز">ساعات ومنظمات غاز</option>
          <option value="ليات غاز ورجلات">ليات غاز ورجلات</option>
          <option value="لوازم الرحلات وادواتها">لوازم الرحلات وادواتها</option>
          <option value="دفايات">دفايات</option>
          <option value="محابس وتواصيل غاز">محابس وتواصيل غاز</option>
        </select>
      </div>
      <div style="margin-bottom:15px;">
        <label style="display:block; font-size:13px; font-weight:700; margin-bottom:5px;">اسم القسم الفرعي الجديد:</label>
        <input type="text" id="modal-new-subcat" placeholder="أدخل اسم القسم الفرعي..." style="width:100%; padding:8px; border:1px solid #cbd5e0; border-radius:6px; font-family:'Cairo'; box-sizing:border-box;">
      </div>
      <div class="modal-actions">
        <button style="background:#27ae60; color:#fff;" onclick="saveNewSubCategory()">حفظ القسم</button>
        <button style="background:#e2e8f0; color:#4a5568;" onclick="closeModal('subcat-modal')">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- مودال السلة -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal-card">
      <h3>قائمة الطلبات</h3>
      <div id="cart-items-container" style="max-height:250px; overflow-y:auto; margin:15px 0;"></div>
      <div class="modal-actions">
        <button style="background:#25d366; color:#fff;" onclick="sendCartToWhatsApp()">إرسال للواتساب</button>
        <button style="background:#e2e8f0; color:#4a5568;" onclick="closeModal('cart-modal')">إغلاق</button>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 الأنسياب المتقدم - جميع الحقوق محفوظة</p>
  </footer>

  <script>
    const defaultProducts = [
      { id: 1, name: "مسدس لحام إيطالي فاخر", mainCat: "ادوات لحام ووصواريخ بقاعدة", subCat: "مسدسات لحام ايطالي", stock: 8, images: [] },
      { id: 2, name: "موقد غاز سفري رحلات", mainCat: "مواقد غاز", subCat: "مواقد رحلات", stock: 3, images: [] }
    ];

    let products = JSON.parse(localStorage.getItem('ansiyab_products_v4')) || defaultProducts;
    let cart = JSON.parse(localStorage.getItem('ansiyab_cart')) || [];
    let customSubCategories = JSON.parse(localStorage.getItem('ansiyab_custom_subcats')) || {};

    document.addEventListener('DOMContentLoaded', () => {
      renderProducts(products);
      updateCartBadge();
    });

    function renderProducts(prods) {
      const container = document.getElementById('products-container');
      container.innerHTML = '';
      prods.forEach(prod => {
        let stockHtml = prod.stock > 0 ? `<span style="color:#0288d1; font-weight:700; font-size:12px;">متوفر (${prod.stock})</span>` : `<span style="color:#c62828; font-weight:700; font-size:12px;">نفذت الكمية</span>`;
        container.innerHTML += `
          <div class="product-card">
            <div>
              <div style="background:#f8fafc; border-radius:8px; padding:10px; text-align:center; margin-bottom:10px; height:130px; display:flex; align-items:center; justify-content:center;">
                <span style="color:#a0aec0; font-size:12px;">صورة المنتج</span>
              </div>
              <div style="font-size:11px; color:#718096; margin-bottom:4px;">${prod.mainCat} / ${prod.subCat || 'عام'}</div>
              <h3 style="font-size:15px; color:#1b365d; margin:0 0 10px 0; font-weight:800;">${prod.name}</h3>
              <div style="margin-bottom:10px;">${stockHtml}</div>
            </div>
            <a href="product.html?id=${prod.id}" style="display:block; text-align:center; background:#1b365d; color:#fff; padding:8px; border-radius:6px; text-decoration:none; font-weight:700; font-size:13px;">التفاصيل والطلب</a>
          </div>
        `;
      });
    }

    function openAddSubCategoryModal() {
      document.getElementById('subcat-modal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function saveNewSubCategory() {
      let mainCat = document.getElementById('modal-main-cat').value;
      let subCatName = document.getElementById('modal-new-subcat').value.trim();
      if (!subCatName) {
        alert("الرجاء إدخال اسم القسم الفرعي.");
        return;
      }
      if (!customSubCategories[mainCat]) {
        customSubCategories[mainCat] = [];
      }
      if (customSubCategories[mainCat].includes(subCatName)) {
        alert("هذا القسم الفرعي موجود مسبقاً!");
        return;
      }
      customSubCategories[mainCat].push(subCatName);
      localStorage.setItem('ansiyab_custom_subcats', JSON.stringify(customSubCategories));
      alert(`تم إضافة القسم الفرعي "${subCatName}" بنجاح تحت (${mainCat})!`);
      document.getElementById('modal-new-subcat').value = '';
      closeModal('subcat-modal');
    }

    function openCartModal() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = cart.length === 0 ? '<p style="text-align:center; color:#a0aec0;">قائمة الطلب فارغة</p>' : '';
      cart.forEach((item, i) => {
        container.innerHTML += `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #edf2f7;"><span>${item.name}</span><button onclick="removeFromCart(${i})" style="background:none; border:none; color:red; cursor:pointer;">حذف</button></div>`;
      });
      document.getElementById('cart-modal').style.display = 'flex';
    }

    function removeFromCart(i) {
      cart.splice(i, 1);
      localStorage.setItem('ansiyab_cart', JSON.stringify(cart));
      updateCartBadge();
      openCartModal();
    }

    function updateCartBadge() {
      document.getElementById('cart-count').innerText = cart.reduce((s, i) => s + i.qty, 0);
    }

    function sendCartToWhatsApp() {
      if (cart.length === 0) return alert("السلة فارغة");
      let msg = "طلب جديد:\n" + cart.map(i => `- ${i.name}`).join('\n');
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }
  </script>
</body>
</html>
