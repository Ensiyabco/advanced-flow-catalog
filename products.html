<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأنسياب المتقدم | كتالوج المنتجات</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box !important; }
    html, body {
      width: 100%; max-width: 100%; margin: 0; padding: 0;
      font-family: 'Cairo', sans-serif !important;
      background-color: #f4f7f9; color: #2d3748; line-height: 1.6;
    }

    header {
      background-color: #ffffff; border-bottom: 1px solid #e2e8f0;
      padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); position: sticky; top: 0; z-index: 1000;
    }
    .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-container img { height: 40px; object-fit: contain; }
    .logo-text { font-size: 17px; font-weight: 800; color: #1b365d; }

    .header-actions { display: flex; align-items: center; gap: 10px; }
    .cart-btn-header {
      background-color: #2b6cb0; color: #fff; border: none; padding: 8px 16px;
      border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; gap: 6px; font-family: 'Cairo', sans-serif;
    }
    .cart-badge { background-color: #e53e3e; color: white; border-radius: 50%; padding: 2px 7px; font-size: 11px; }

    .btn-admin {
      background-color: #1b365d; color: #fff; border: none; padding: 8px 14px;
      border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer;
      font-family: 'Cairo', sans-serif; transition: 0.2s;
    }
    .btn-admin:hover { background-color: #2c5282; }

    .main-layout { display: flex; max-width: 1300px; margin: 25px auto; gap: 20px; padding: 0 15px; }

    .sidebar { width: 320px; flex-shrink: 0; background: #fff; border-radius: 10px; border: 1px solid #e2e8f0; padding: 15px; height: fit-content; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; }
    .sidebar-header h3 { font-size: 16px; margin: 0; font-weight: 800; color: #1b365d; }

    .accordion-item { border-bottom: 1px solid #edf2f7; }
    .accordion-header {
      width: 100%; text-align: right; background: none; border: none; padding: 10px 5px;
      font-size: 13px; font-weight: 700; color: #2d3748; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; font-family: 'Cairo', sans-serif;
    }
    .accordion-header:hover { color: #2b6cb0; }
    .accordion-content { display: none; padding: 5px 15px 10px 0; background: #fafbfc; }
    .accordion-content.active { display: block; }
    .subcat-link {
      display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 12px; color: #4a5568; text-decoration: none; font-weight: 600; cursor: pointer;
    }
    .subcat-link:hover { color: #e53e3e; }

    /* تنسيق صورة القسم التوضيحية */
    .cat-icon { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; border: 1px solid #e2e8f0; }

    .products-container { flex: 1; }
    .top-filter-bar {
      background: #fff; padding: 12px 20px; border-radius: 10px; border: 1px solid #e2e8f0;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }

    .product-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px;
      position: relative; display: flex; flex-direction: column; justify-content: space-between;
      transition: transform 0.2s;
    }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 6px 15px rgba(0,0,0,0.05); }

    .prod-actions-top { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; z-index: 5; }
    .btn-action { background: rgba(255,255,255,0.9); border: 1px solid #cbd5e0; border-radius: 4px; padding: 4px 6px; cursor: pointer; font-size: 12px; }

    .prod-img { width: 100%; height: 160px; object-fit: contain; background: #f8fafc; border-radius: 6px; margin-bottom: 10px; }
    .prod-title { font-size: 14px; font-weight: 800; color: #1b365d; margin: 0 0 8px 0; text-align: center; }

    .specs-table { width: 100%; font-size: 11px; border-collapse: collapse; margin-bottom: 10px; background: #f8fafc; }
    .specs-table th, .specs-table td { border: 1px solid #edf2f7; padding: 4px; text-align: center; }
    .specs-table th { color: #718096; font-weight: 700; }
    .specs-table td { font-weight: 800; color: #2d3748; }

    .order-box { background: #f7fafc; padding: 8px; border-radius: 6px; border: 1px solid #edf2f7; margin-bottom: 8px; }
    .stock-row { font-size: 11px; font-weight: 700; color: #2b6cb0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .qty-row { display: flex; gap: 6px; align-items: center; }
    .qty-row input { width: 50px; padding: 4px; border: 1px solid #cbd5e0; border-radius: 4px; text-align: center; font-size: 12px; }
    .qty-row select { flex: 1; padding: 4px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 11px; font-family: 'Cairo', sans-serif; }

    .btn-add-cart {
      width: 100%; background: #1b365d; color: white; border: none; padding: 8px;
      border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: 'Cairo', sans-serif;
    }
    .btn-add-cart:hover { background: #2c5282; }

    /* إخفاء أدوات المشرف تلقائياً للزوار */
    .admin-only { display: none !important; }

    @media (max-width: 768px) {
      .main-layout { flex-direction: column; }
      .sidebar { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <img src="assets/images/logo.png" alt="شعار المؤسسة" onerror="this.src='https://i.imgur.com/7A26w6i.png'">
      <div class="logo-text">الأنسياب المتقدم</div>
    </a>
    
    <div class="header-actions">
      <button class="btn-admin admin-only" onclick="addMainCategory()">+ قسم جديد</button>
      <button class="btn-admin admin-only" onclick="addNewProduct()">+ إضافة منتج</button>
      
      <button class="cart-btn-header" onclick="location.href='cart.html'">
        <span>قائمة الطلبات</span>
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <div class="main-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h3>أقسام المنتجات</h3>
        <button class="btn-admin admin-only" onclick="addMainCategory()" style="padding: 3px 8px; font-size: 11px;">+ قسم رئيسي</button>
      </div>
      <div id="accordion-container">
        <!-- يتم جلب جميع الأقسام والكتالوج هنا تلقائياً -->
      </div>
    </aside>

    <main class="products-container">
      <div class="top-filter-bar">
        <span id="current-category-name" style="font-weight: 800; font-size: 15px; color: #1b365d;">جميع المنتجات</span>
        <span id="products-count" style="font-size: 12px; color: #718096; background: #edf2f7; padding: 3px 8px; border-radius: 12px; font-weight: 700;">0 منتج</span>
      </div>

      <div class="products-grid" id="products-grid">
        <!-- كروت المنتجات -->
      </div>
    </main>
  </div>

  <script>
    // جميع الأقسام الرئيسية والفرعية مع معرف فريد id لكل قسم
    const defaultCategories = [
      { id: 1, name: "ادوات لحام ووصواريخ بقاعدة", subcategories: ["مسدسات لحام ايطالي", "مسدسات لحام صيني", "صواريخ بقاعدة", "مسدسات لحام سفري"] },
      { id: 2, name: "مواقد غاز", subcategories: ["مواقد غاز منزلية", "مواقد غاز مطاعم", "مواقد غاز مطابخ", "مواقد رحلات", "مواقد كويتي", "مواقد كنافة", "مسطحات تماتيك", "مواقد كهرباء"] },
      { id: 3, name: "ادوات ولوازم الرحلات", subcategories: ["جوالين وسطول", "شنط وتجهيزات", "جلسات خارجيه", "زمزميات وقوارير", "اضاءة وانارة"] },
      { id: 4, name: "ادوات ولوازم الشواء", subcategories: ["ذرايات وسواتر", "شبوك شوي", "مناقل شوي", "اسياخ شوي", "شنط رحلات"] },
      { id: 5, name: "دفايات", subcategories: ["دفايات قاز", "دفايات غاز", "دفايات كهرباء", "دفايات زيت", "دفايات رحلات", "قطع غيار دفايات"] },
      { id: 6, name: "محابس وتواصيل", subcategories: ["محابس غاز", "تواصيل غاز", "قسامات وموصلات غاز", "تواصيل ومحولات سفري", "قفزان ليات"] },
      { id: 7, name: "ساعات ومنظمات غاز", subcategories: ["ساعات غاز منزليه", "ساعات غاز مطاعم", "ساعات غاز سفري", "ساعات غاز شبكات", "تحويلات غاز"] },
      { id: 8, name: "ليات غاز", subcategories: ["ليات غاز منزليه", "ليات غاز مطاعم", "ليات مواقد رحلات"] },
      { id: 9, name: "ولاعات وشعالات", subcategories: ["ولاعات غاز", "ولاعات بخور", "ولاعات سفري", "شعالات فحم", "قوالب اشعال", "سوائل اشعال"] },
      { id: 10, name: "قطع غيار", subcategories: ["قطع غيار مواقد", "قطع غيار دبات", "قطع غيار دوافير", "قطغ غيار عامه"] },
      { id: 11, name: "قدور", subcategories: ["قدور منزليه", "قدور مطاعم", "قدور عسل", "صواني"] },
      { id: 12, name: "خضاضات وسطول", subcategories: ["خضاضات لبن", "سطول لبن", "مواعين سمن"] },
      { id: 13, name: "دوافير ودبات", subcategories: ["دبات غاز", "روس دوافير", "روس دوافير بلي", "دبات غاز سفري", "اكسسوارات دوافير"] },
      { id: 14, name: "طباخات وفوانيس", subcategories: ["طباخات بالقاز السائل", "فوانيس بالقاز السائل", "فوانيس بالبطاريات", "دوافير قاز", "اتاريك قاز", "اتاريك غاز", "فتايل"] },
      { id: 15, name: "منزليات", subcategories: [] },
      { id: 16, name: "اكسسوارات عامة", subcategories: [] }
    ];

    let categoriesData = JSON.parse(localStorage.getItem('ansiyab_categories')) || defaultCategories;
    let categoryImages = JSON.parse(localStorage.getItem('ansiyab_cat_images')) || {};

    let products = JSON.parse(localStorage.getItem('ansiyab_products')) || [
      {
        id: 1,
        name: "دافور غاز سفري متكامل",
        category: "دوافير ودبات",
        subcategory: "دبات غاز سفري",
        unit: "حبة",
        boxQty: 12,
        stock: 50,
        img: "assets/images/logo.png"
      }
    ];

    let cart = JSON.parse(localStorage.getItem('ansiyab_cart')) || [];

    document.addEventListener('DOMContentLoaded', function() {
      renderCategories();
      renderProducts(products);
      updateCartBadge();
      checkAdminStatus();
    });

    function checkAdminStatus() {
      const isAdmin = localStorage.getItem("isAdmin") === "true";
      document.querySelectorAll('.admin-only').forEach(el => {
        if (isAdmin) {
          el.style.setProperty('display', 'inline-block', 'important');
        } else {
          el.style.setProperty('display', 'none', 'important');
        }
      });
    }

    function saveCategories() {
      localStorage.setItem('ansiyab_categories', JSON.stringify(categoriesData));
      renderCategories();
    }

    function saveProducts() {
      localStorage.setItem('ansiyab_products', JSON.stringify(products));
      renderProducts(products);
    }

    function addMainCategory() {
      const name = prompt("أدخل اسم القسم الرئيسي الجديد:");
      if (name && name.trim()) {
        const newCat = {
          id: Date.now(),
          name: name.trim(),
          subcategories: []
        };
        categoriesData.push(newCat);
        saveCategories();
      }
    }

    function addSubCategory(catId) {
      const subName = prompt("أدخل اسم القسم الفرعي الجديد:");
      if (subName && subName.trim()) {
        const cat = categoriesData.find(c => c.id === catId);
        if (cat) {
          cat.subcategories.push(subName.trim());
          saveCategories();
        }
      }
    }

    function renderCategories() {
      const container = document.getElementById('accordion-container');
      container.innerHTML = `
        <div class="accordion-item">
          <button class="accordion-header" onclick="filterBySubcat('ALL', 'جميع المنتجات')">
            <span>جميع المنتجات</span>
          </button>
        </div>
      `;

      categoriesData.forEach((cat, index) => {
        const item = document.createElement('div');
        item.className = 'accordion-item';

        let subHtml = '';
        if (cat.subcategories && cat.subcategories.length > 0) {
          cat.subcategories.forEach(sub => {
            subHtml += `
              <div class="subcat-link" onclick="filterBySubcat('${sub}', '${sub}')">
                <span>• ${sub}</span>
              </div>`;
          });
        } else {
          subHtml = `<div class="subcat-link" onclick="filterBySubcat('${cat.name}', '${cat.name}')"><span>• عرض الكل</span></div>`;
        }

        subHtml += `<button class="btn-admin admin-only" style="margin-top:5px; padding: 2px 6px; font-size: 10px;" onclick="addSubCategory(${cat.id})">+ فرعي جديد</button>`;

        const imgSrc = categoryImages[cat.id] || 'assets/images/logo.png';

        item.innerHTML = `
          <button class="accordion-header" onclick="toggleAccordion(${index})">
            <div style="display: flex; align-items: center; gap: 8px;">
              <img src="${imgSrc}" class="cat-icon" onerror="this.src='https://i.imgur.com/7A26w6i.png'">
              <span>${cat.name}</span>
              <span class="admin-only" onclick="event.stopPropagation(); changeCategoryImage(${cat.id})" title="تغيير صورة القسم" style="font-size: 11px; cursor: pointer; background: #e2e8f0; padding: 2px 5px; border-radius: 4px;">📷</span>
            </div>
            <span id="arrow-${index}">▼</span>
          </button>
          <div class="accordion-content" id="content-${index}">
            ${subHtml}
          </div>
        `;
        container.appendChild(item);
      });

      checkAdminStatus();
    }

    function changeCategoryImage(catId) {
      const newImg = prompt("أدخل رابط الصورة الجديدة للقسم (URL):");
      if (newImg && newImg.trim() !== "") {
        categoryImages[catId] = newImg.trim();
        localStorage.setItem('ansiyab_cat_images', JSON.stringify(categoryImages));
        renderCategories();
        alert("تم تحديث صورة القسم بنجاح!");
      }
    }

    function toggleAccordion(index) {
      const content = document.getElementById(`content-${index}`);
      const arrow = document.getElementById(`arrow-${index}`);
      const isOpen = content.classList.contains('active');

      document.querySelectorAll('.accordion-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('[id^="arrow-"]').forEach(a => a.innerText = '▼');

      if (!isOpen) {
        content.classList.add('active');
        arrow.innerText = '▲';
      }
    }

    function filterBySubcat(subName, title) {
      document.getElementById('current-category-name').innerText = title;
      if (subName === 'ALL') {
        renderProducts(products);
      } else {
        const filtered = products.filter(p => p.subcategory === subName || p.category === subName);
        renderProducts(filtered);
      }
    }

    function renderProducts(list) {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';
      document.getElementById('products-count').innerText = `${list.length} منتج`;

      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="prod-actions-top admin-only">
            <button class="btn-action admin-only" onclick="editProduct(${p.id})">✏️</button>
            <button class="btn-action admin-only" onclick="deleteProduct(${p.id})">🗑️</button>
          </div>

          <img src="${p.img}" class="prod-img" onerror="this.src='https://i.imgur.com/7A26w6i.png'">
          <h4 class="prod-title">${p.name}</h4>

          <table class="specs-table">
            <tr><th>الوحدة</th><th>شد الكرتون</th><th>المخزن</th></tr>
            <tr><td>${p.unit}</td><td>${p.boxQty}</td><td>${p.stock}</td></tr>
          </table>

          <div class="order-box">
            <div class="stock-row">
              <span>المتوفر: ${p.stock}</span>
              <button class="btn-action admin-only" onclick="updateStock(${p.id})" style="background:#e2e8f0;">تحديث المخزن 🔄</button>
            </div>
            <div class="qty-row">
              <label style="font-size:11px; font-weight:700;">الطلبية:</label>
              <input type="number" id="qty-${p.id}" value="1" min="1">
              <select id="unit-${p.id}">
                <option value="حبة">حبة</option>
                <option value="كرتون">كرتون</option>
                <option value="علبة">علبة</option>
                <option value="درزن">درزن</option>
                <option value="ربطة">ربطة</option>
                <option value="لفة">لفة</option>
              </select>
            </div>
          </div>

          <button class="btn-add-cart" onclick="addToCart(${p.id})">إضافة لقائمة الطلب 🛒</button>
        `;
        grid.appendChild(card);
      });

      checkAdminStatus();
    }

    function addNewProduct() {
      const name = prompt("أدخل اسم المنتج الجديد:");
      if (!name) return;
      const category = prompt("أدخل اسم القسم الرئيسي:");
      const subcategory = prompt("أدخل اسم القسم الفرعي:");
      const unit = prompt("أدخل الوحدة الأساسية (مثال: حبة، كرتون):") || "حبة";
      const boxQty = parseInt(prompt("أدخل عدد الشد داخل الكرتون:")) || 1;
      const stock = parseInt(prompt("أدخل الكمية المتوفرة بالمخزن:")) || 0;
      const img = prompt("أدخل رابط صورة المنتج:") || "assets/images/logo.png";

      const newProd = {
        id: Date.now(),
        name, category, subcategory, unit, boxQty, stock, img
      };

      products.push(newProd);
      saveProducts();
    }

    function editProduct(id) {
      const p = products.find(prod => prod.id === id);
      if (!p) return;

      const newName = prompt("تعديل اسم المنتج:", p.name);
      if (newName === null) return;
      const newStock = prompt("تعديل الكمية في المخزن:", p.stock);
      const newBoxQty = prompt("تعديل شد الكرتون:", p.boxQty);
      const newImg = prompt("تعديل رابط الصورة:", p.img);

      p.name = newName || p.name;
      p.stock = newStock !== null ? parseInt(newStock) : p.stock;
      p.boxQty = newBoxQty !== null ? parseInt(newBoxQty) : p.boxQty;
      p.img = newImg || p.img;

      saveProducts();
    }

    function deleteProduct(id) {
      if (confirm("هل أنت تأكد من رغبتك في حذف هذا المنتج؟")) {
        products = products.filter(p => p.id !== id);
        saveProducts();
      }
    }

    function updateStock(id) {
      const p = products.find(prod => prod.id === id);
      if (!p) return;
      const newStock = prompt("أدخل كمية المخزن الجديدة:", p.stock);
      if (newStock !== null) {
        p.stock = parseInt(newStock) || 0;
        saveProducts();
      }
    }

    function addToCart(prodId) {
      const p = products.find(item => item.id === prodId);
      const qty = parseInt(document.getElementById(`qty-${prodId}`).value) || 1;
      const unit = document.getElementById(`unit-${prodId}`).value;

      cart.push({ id: p.id, name: p.name, quantity: qty, unit: unit });
      localStorage.setItem('ansiyab_cart', JSON.stringify(cart));
      updateCartBadge();
      alert('تمت إضافة المنتج إلى قائمة الطلب بنجاح!');
    }

    function updateCartBadge() {
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cart-count').innerText = totalCount;
    }
  </script>
</body>
</html>
