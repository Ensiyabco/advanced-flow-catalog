<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأنسياب المتقدم | كتالوج المنتجات</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box !important; }
    html, body {
      width: 100%; max-width: 100%; margin: 0; padding: 0;
      font-family: 'Cairo', sans-serif !important;
      background-color: #f4f7f9; color: #2d3748; line-height: 1.6;
    }

    header {
      background-color: #ffffff; border-bottom: 1px solid #e2e8f0;
      padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); position: sticky; top: 0; z-index: 1000;
    }
    .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-container img { height: 40px; object-fit: contain; }
    .logo-text { font-size: 17px; font-weight: 800; color: #1b365d; }

    .header-actions { display: flex; align-items: center; gap: 10px; }
    .cart-btn-header {
      background-color: #2b6cb0; color: #fff; border: none; padding: 8px 16px;
      border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; gap: 6px; font-family: 'Cairo', sans-serif;
    }
    .cart-badge { background-color: #e53e3e; color: white; border-radius: 50%; padding: 2px 7px; font-size: 11px; }

    .btn-admin {
      background-color: #1b365d; color: #fff; border: none; padding: 8px 14px;
      border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer;
      font-family: 'Cairo', sans-serif; transition: 0.2s;
    }
    .btn-admin:hover { background-color: #2c5282; }

    .main-layout { max-width: 1300px; margin: 25px auto; padding: 0 15px; }

    .section-title-bar {
      font-size: 18px; font-weight: 800; color: #1b365d; margin-bottom: 15px;
      border-right: 4px solid #2b6cb0; padding-right: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .categories-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; margin-bottom: 30px;
    }
    .category-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px;
      text-align: center; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .category-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
    .category-card img { width: 70px; height: 70px; object-fit: contain; margin-bottom: 12px; background: #f8fafc; border-radius: 8px; padding: 5px; border: 1px solid #edf2f7; }
    .category-card h4 { font-size: 14px; font-weight: 800; color: #1b365d; margin: 0; }
    
    .cat-edit-badge {
      position: absolute; top: 10px; left: 10px; background: #edf2f7; border: 1px solid #cbd5e0;
      border-radius: 4px; padding: 3px 6px; font-size: 11px; cursor: pointer;
    }

    .products-container { margin-top: 20px; }
    .top-filter-bar {
      background: #fff; padding: 12px 20px; border-radius: 10px; border: 1px solid #e2e8f0;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }

    .product-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px;
      position: relative; display: flex; flex-direction: column; justify-content: space-between;
      transition: transform 0.2s;
    }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 6px 15px rgba(0,0,0,0.05); }

    .prod-actions-top { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; z-index: 5; }
    .btn-action { background: rgba(255,255,255,0.9); border: 1px solid #cbd5e0; border-radius: 4px; padding: 4px 6px; cursor: pointer; font-size: 12px; }

    .prod-img-wrapper { position: relative; cursor: pointer; }
    .prod-img { width: 100%; height: 160px; object-fit: contain; background: #f8fafc; border-radius: 6px; margin-bottom: 10px; }
    .img-count-badge {
      position: absolute; bottom: 15px; left: 10px; background: rgba(27, 54, 93, 0.85);
      color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700;
    }
    .prod-title { font-size: 14px; font-weight: 800; color: #1b365d; margin: 0 0 8px 0; text-align: center; }

    .specs-table { width: 100%; font-size: 11px; border-collapse: collapse; margin-bottom: 10px; background: #f8fafc; }
    .specs-table th, .specs-table td { border: 1px solid #edf2f7; padding: 4px; text-align: center; }
    .specs-table th { color: #718096; font-weight: 700; }
    .specs-table td { font-weight: 800; color: #2d3748; }

    .order-box { background: #f7fafc; padding: 8px; border-radius: 6px; border: 1px solid #edf2f7; margin-bottom: 8px; }
    .stock-row { font-size: 11px; font-weight: 700; color: #2b6cb0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .qty-row { display: flex; gap: 6px; align-items: center; }
    .qty-row input { width: 50px; padding: 4px; border: 1px solid #cbd5e0; border-radius: 4px; text-align: center; font-size: 12px; }
    .qty-row select { flex: 1; padding: 4px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 11px; font-family: 'Cairo', sans-serif; }

    .btn-add-cart {
      width: 100%; background: #1b365d; color: white; border: none; padding: 8px;
      border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: 'Cairo', sans-serif;
    }
    .btn-add-cart:hover { background: #2c5282; }

    .admin-only { display: none !important; }

    .modal-backdrop {
      display: none; position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;
    }
    .modal-content {
      background: #fff; padding: 20px; border-radius: 10px; width: 90%; max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); font-family: 'Cairo', sans-serif;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-content h4 { margin: 0 0 15px 0; color: #1b365d; text-align: center; }
    .form-group { margin-bottom: 12px; text-align: right; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-family: 'Cairo'; }

    .gallery-main-img { width: 100%; height: 280px; object-fit: contain; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 10px; }
    .gallery-thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; justify-content: center; }
    .gallery-thumb { width: 55px; height: 55px; object-fit: cover; border-radius: 6px; border: 2px solid #cbd5e0; cursor: pointer; opacity: 0.7; }
    .gallery-thumb.active { border-color: #2b6cb0; opacity: 1; }
  </style>
</head>
<body>

  <input type="file" id="global-cat-file-input" accept="image/*" style="display: none;" onchange="handleCatFileUpload(event)">

  <header>
    <a href="#" class="logo-container">
      <img src="assets/images/logo.png" alt="شعار المؤسسة" onerror="this.src='https://i.imgur.com/7A26w6i.png'">
      <div class="logo-text">الأنسياب المتقدم</div>
    </a>
    
    <div class="header-actions">
      <button class="btn-admin admin-only" onclick="addMainCategory()">+ قسم جديد</button>
      <button class="btn-admin admin-only" onclick="openAddModal()">+ إضافة منتج</button>
      
      <button class="cart-btn-header" onclick="location.href='cart.html'">
        <span>قائمة الطلبات</span>
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <div class="main-layout">
    <div class="section-title-bar">
      <span>تصفح الأقسام الرئيسية</span>
      <button class="btn-admin admin-only" onclick="addMainCategory()" style="padding: 4px 10px; font-size: 12px;">+ قسم رئيسي</button>
    </div>
    
    <div class="categories-grid" id="categories-grid"></div>

    <div class="products-container">
      <div class="top-filter-bar">
        <span id="current-category-name" style="font-weight: 800; font-size: 15px; color: #1b365d;">جميع المنتجات</span>
        <span id="products-count" style="font-size: 12px; color: #718096; background: #edf2f7; padding: 3px 8px; border-radius: 12px; font-weight: 700;">0 منتج</span>
      </div>

      <div class="products-grid" id="products-grid"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="productModal">
    <div class="modal-content">
      <h4 id="modalTitle">إدارة المنتج</h4>
      <input type="hidden" id="edit-prod-id">
      
      <div class="form-group">
        <label>اسم المنتج:</label>
        <input type="text" id="edit-prod-name">
      </div>
      
      <div class="form-group">
        <label>المخزن (الكمية المتوفرة):</label>
        <input type="number" id="edit-prod-stock">
      </div>
      
      <div class="form-group">
        <label>شد الكرتون:</label>
        <input type="number" id="edit-prod-box">
      </div>

      <div class="form-group">
        <label>اختر صور المنتج (يمكنك اختيار عدة صور معاً):</label>
        <input type="file" id="edit-prod-files" accept="image/*" multiple>
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 15px;">
        <button class="btn-admin" style="background: #718096;" onclick="closeModal()">إلغاء</button>
        <button class="btn-admin" onclick="saveModalProduct()">حفظ التغييرات</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="galleryModal">
    <div class="modal-content" style="text-align: center;">
      <h4 id="galleryModalTitle">معرض صور المنتج</h4>
      <img id="gallery-main-view" class="gallery-main-img" src="" onerror="this.src='https://i.imgur.com/7A26w6i.png'">
      <div class="gallery-thumbs" id="gallery-thumbs-container"></div>
      <div style="margin-top: 15px;">
        <button class="btn-admin" style="background: #718096; padding: 6px 20px;" onclick="closeGalleryModal()">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    const defaultCategories = [
      { id: 1, name: "ادوات لحام ووصواريخ بقاعدة", subcategories: ["مسدسات لحام ايطالي", "مسدسات لحام صيني", "صواريخ بقاعدة", "مسدسات لحام سفري"] },
      { id: 2, name: "مواقد غاز", subcategories: ["مواقد غاز منزلية", "مواقد غاز مطاعم", "مواقد غاز مطابخ", "مواقد رحلات", "مواقد كويتي", "مواقد كنافة", "مسطحات تماتيك", "مواقد كهرباء"] },
      { id: 3, name: "ادوات ولوازم الرحلات", subcategories: ["جوالين وسطول", "شنط وتجهيزات", "جلسات خارجيه", "زمزميات وقوارير", "اضاءة وانارة"] },
      { id: 4, name: "ادوات ولوازم الشواء", subcategories: ["ذرايات وسواتر", "شبوك شوي", "مناقل شوي", "اسياخ شوي", "شنط رحلات"] },
      { id: 5, name: "دفايات", subcategories: ["دفايات قاز", "دفايات غاز", "دفايات كهرباء", "دفايات زيت", "دفايات رحلات", "قطع غيار دفايات"] },
      { id: 6, name: "محابس وتواصيل", subcategories: ["محابس غاز", "تواصيل غاز", "قسامات وموصلات غاز", "تواصيل ومحولات سفري", "قفزان ليات"] },
      { id: 7, name: "ساعات ومنظمات غاز", subcategories: ["ساعات غاز منزليه", "ساعات غاز مطاعم", "ساعات غاز سفري", "ساعات غاز شبكات", "تحويلات غاز"] },
      { id: 8, name: "ليات غاز", subcategories: ["ليات غاز منزليه", "ليات غاز مطاعم", "ليات مواقد رحلات"] },
      { id: 9, name: "ولاعات وشعالات", subcategories: ["ولاعات غاز", "ولاعات بخور", "ولاعات سفري", "شعالات فحم", "قوالب اشعال", "سوائل اشعال"] },
      { id: 10, name: "قطع غيار", subcategories: ["قطع غيار مواقد", "قطع غيار دبات", "قطع غيار دوافير", "قطغ غيار عامه"] },
      { id: 11, name: "قدور", subcategories: ["قدور منزليه", "قدور مطاعم", "قدور عسل", "صواني"] },
      { id: 12, name: "خضاضات وسطول", subcategories: ["خضاضات لبن", "سطول لبن", "مواعين سمن"] },
      { id: 13, name: "دوافير ودبات", subcategories: ["دبات غاز", "روس دوافير", "روس دوافير بلي", "دبات غاز سفري", "اكسسوارات دوافير"] },
      { id: 14, name: "طباخات وفوانيس", subcategories: ["طباخات بالقاز السائل", "فوانيس بالقاز السائل", "فوانيس بالبطاريات", "دوافير قاز", "اتاريك قاز", "اتاريك غاز", "فتايل"] },
      { id: 15, name: "منزليات", subcategories: [] },
      { id: 16, name: "اكسسوارات عامة", subcategories: [] }
    ];

    let categoriesData = JSON.parse(localStorage.getItem('ansiyab_categories')) || defaultCategories;
    let categoryImages = JSON.parse(localStorage.getItem('ansiyab_cat_images')) || {};
    let activeCategoryForImage = null;

    let products = JSON.parse(localStorage.getItem('ansiyab_products')) || [
      {
        id: 1,
        name: "دافور غاز سفري متكامل",
        category: "دوافير ودبات",
        subcategory: "دبات غاز سفري",
        unit: "حبة",
        boxQty: 12,
        stock: 50,
        images: ["assets/images/logo.png"]
      }
    ];

    let cart = JSON.parse(localStorage.getItem('ansiyab_cart')) || [];

    document.addEventListener('DOMContentLoaded', function() {
      // تصحيح هيكل الصور للمنتجات المحفوظة مسبقاً
      products.forEach(p => {
        if (!p.images) {
          p.images = p.img ? [p.img] : ['assets/images/logo.png'];
        }
      });
      renderCategoriesGrid();
      renderProducts(products);
      updateCartBadge();
      checkAdminStatus();
    });

    function checkAdminStatus() {
      const isAdmin = localStorage.getItem("isAdmin") === "true";
      document.querySelectorAll('.admin-only').forEach(el => {
        if (isAdmin) {
          el.style.setProperty('display', 'inline-block', 'important');
        } else {
          el.style.setProperty('display', 'none', 'important');
        }
      });
    }

    function saveCategories() {
      localStorage.setItem('ansiyab_categories', JSON.stringify(categoriesData));
      renderCategoriesGrid();
    }

    function saveProducts() {
      localStorage.setItem('ansiyab_products', JSON.stringify(products));
      renderProducts(products);
    }

    function addMainCategory() {
      const name = prompt("أدخل اسم القسم الرئيسي الجديد:");
      if (name && name.trim()) {
        const newCat = { id: Date.now(), name: name.trim(), subcategories: [] };
        categoriesData.push(newCat);
        saveCategories();
      }
    }

    function renderCategoriesGrid() {
      const container = document.getElementById('categories-grid');
      container.innerHTML = '';

      categoriesData.forEach(cat => {
        const card = document.createElement('div');
        card.className = 'category-card';
        card.onclick = () => filterByCategory(cat.name);

        const imgSrc = categoryImages[cat.id] || 'assets/images/logo.png';

        card.innerHTML = `
          <span class="cat-edit-badge admin-only" onclick="event.stopPropagation(); triggerCategoryFile(${cat.id})" title="تغيير صورة القسم">📷</span>
          <img src="${imgSrc}" onerror="this.src='https://i.imgur.com/7A26w6i.png'">
          <h4>${cat.name}</h4>
        `;
        container.appendChild(card);
      });

      checkAdminStatus();
    }

    function triggerCategoryFile(catId) {
      activeCategoryForImage = catId;
      const fileInput = document.getElementById('global-cat-file-input');
      fileInput.value = "";
      fileInput.click();
    }

    function handleCatFileUpload(event) {
      const file = event.target.files[0];
      if (file && activeCategoryForImage !== null) {
        const reader = new FileReader();
        reader.onload = function(e) {
          categoryImages[activeCategoryForImage] = e.target.result;
          localStorage.setItem('ansiyab_cat_images', JSON.stringify(categoryImages));
          renderCategoriesGrid();
          activeCategoryForImage = null;
        };
        reader.readAsDataURL(file);
      }
    }

    function filterByCategory(catName) {
      document.getElementById('current-category-name').innerText = catName;
      const filtered = products.filter(p => p.category === catName || p.subcategory === catName);
      renderProducts(filtered);
    }

    function renderProducts(list) {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';
      document.getElementById('products-count').innerText = `${list.length} منتج`;

      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        const mainImg = (p.images && p.images.length > 0) ? p.images[0] : 'assets/images/logo.png';
        const imgCount = p.images ? p.images.length : 1;

        card.innerHTML = `
          <div class="prod-actions-top admin-only">
            <button class="btn-action admin-only" onclick="editProduct(${p.id})">✏️</button>
            <button class="btn-action admin-only" onclick="deleteProduct(${p.id})">🗑️</button>
          </div>

          <div class="prod-img-wrapper" onclick="openGallery(${p.id})" title="عرض صور المنتج">
            <img src="${mainImg}" class="prod-img" onerror="this.src='https://i.imgur.com/7A26w6i.png'">
            ${imgCount > 1 ? `<span class="img-count-badge">📷 ${imgCount} صور</span>` : ''}
          </div>

          <h4 class="prod-title">${p.name}</h4>

          <table class="specs-table">
            <tr><th>الوحدة</th><th>شد الكرتون</th><th>المخزن</th></tr>
            <tr><td>${p.unit}</td><td>${p.boxQty}</td><td>${p.stock}</td></tr>
          </table>

          <div class="order-box">
            <div class="stock-row">
              <span>المتوفر: ${p.stock}</span>
              <button class="btn-action admin-only" onclick="updateStock(${p.id})" style="background:#e2e8f0;">تحديث المخزن 🔄</button>
            </div>
            <div class="qty-row">
              <label style="font-size:11px; font-weight:700;">الطلبية:</label>
              <input type="number" id="qty-${p.id}" value="1" min="1">
              <select id="unit-${p.id}">
                <option value="حبة">حبة</option>
                <option value="كرتون">كرتون</option>
                <option value="علبة">علبة</option>
                <option value="درزن">درزن</option>
                <option value="ربطة">ربطة</option>
                <option value="لفة">لفة</option>
              </select>
            </div>
          </div>

          <button class="btn-add-cart" onclick="addToCart(${p.id})">إضافة لقائمة الطلب 🛒</button>
        `;
        grid.appendChild(card);
      });

      checkAdminStatus();
    }

    function openGallery(prodId) {
      const p = products.find(item => item.id === prodId);
      if (!p || !p.images || p.images.length === 0) return;

      document.getElementById('galleryModalTitle').innerText = p.name;
      const mainView = document.getElementById('gallery-main-view');
      const thumbsContainer = document.getElementById('gallery-thumbs-container');
      
      mainView.src = p.images[0];
      thumbsContainer.innerHTML = '';

      p.images.forEach((imgSrc, idx) => {
        const thumb = document.createElement('img');
        thumb.src = imgSrc;
        thumb.className = `gallery-thumb ${idx === 0 ? 'active' : ''}`;
        thumb.onclick = () => {
          mainView.src = imgSrc;
          document.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
          thumb.classList.add('active');
        };
        thumbsContainer.appendChild(thumb);
      });

      document.getElementById('galleryModal').style.display = 'flex';
    }

    function closeGalleryModal() {
      document.getElementById('galleryModal').style.display = 'none';
    }

    function openAddModal() {
      document.getElementById('modalTitle').innerText = "إضافة منتج جديد";
      document.getElementById('edit-prod-id').value = "";
      document.getElementById('edit-prod-name').value = "";
      document.getElementById('edit-prod-stock').value = "0";
      document.getElementById('edit-prod-box').value = "1";
      document.getElementById('edit-prod-files').value = "";
      document.getElementById('productModal').style.display = 'flex';
    }

    function editProduct(id) {
      const p = products.find(prod => prod.id === id);
      if (!p) return;

      document.getElementById('modalTitle').innerText = "تعديل بيانات وصور المنتج";
      document.getElementById('edit-prod-id').value = p.id;
      document.getElementById('edit-prod-name').value = p.name;
      document.getElementById('edit-prod-stock').value = p.stock;
      document.getElementById('edit-prod-box').value = p.boxQty;
      document.getElementById('edit-prod-files').value = "";
      document.getElementById('productModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('productModal').style.display = 'none';
    }

    function saveModalProduct() {
      const id = document.getElementById('edit-prod-id').value;
      const name = document.getElementById('edit-prod-name').value;
      const stock = parseInt(document.getElementById('edit-prod-stock').value) || 0;
      const boxQty = parseInt(document.getElementById('edit-prod-box').value) || 1;
      const fileInput = document.getElementById('edit-prod-files');

      const applySave = (newImagesList) => {
        if (id) {
          const p = products.find(prod => prod.id == id);
          if (p) {
            p.name = name;
            p.stock = stock;
            p.boxQty = boxQty;
            if (newImagesList && newImagesList.length > 0) {
              p.images = newImagesList;
            }
          }
        } else {
          products.push({
            id: Date.now(),
            name: name || "منتج جديد",
            category: "عام",
            subcategory: "عام",
            unit: "حبة",
            boxQty: boxQty,
            stock: stock,
            images: (newImagesList && newImagesList.length > 0) ? newImagesList : ["assets/images/logo.png"]
          });
        }
        saveProducts();
        closeModal();
      };

      if (fileInput.files && fileInput.files.length > 0) {
        const filePromises = Array.from(fileInput.files).map(file => {
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.readAsDataURL(file);
          });
        });

        Promise.all(filePromises).then(base64Images => {
          applySave(base64Images);
        });
      } else {
        applySave(null);
      }
    }

    function deleteProduct(id) {
      if (confirm("هل أنت تأكد من رغبتك في حذف هذا المنتج؟")) {
        products = products.filter(p => p.id !== id);
        saveProducts();
      }
    }

    function updateStock(id) {
      const p = products.find(prod => prod.id === id);
      if (!p) return;
      const newStock = prompt("أدخل كمية المخزن الجديدة:", p.stock);
      if (newStock !== null) {
        p.stock = parseInt(newStock) || 0;
        saveProducts();
      }
    }

    function addToCart(prodId) {
      const p = products.find(item => item.id === prodId);
      const qty = parseInt(document.getElementById(`qty-${prodId}`).value) || 1;
      const unit = document.getElementById(`unit-${prodId}`).value;

      cart.push({ id: p.id, name: p.name, quantity: qty, unit: unit });
      localStorage.setItem('ansiyab_cart', JSON.stringify(cart));
      updateCartBadge();
      alert('تمت إضافة المنتج إلى قائمة الطلب بنجاح!');
    }

    function updateCartBadge() {
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cart-count').innerText = totalCount;
    }
  </script>
</body>
</html>
