<!-- زر تسجيل الدخول كمسؤول -->
<button id="admin-login-btn" onclick="toggleAdminMode()" style="position: fixed; bottom: 20px; left: 20px; z-index: 9999; padding: 10px 15px; background: #1d3557; color: #fff; border: none; border-radius: 8px; cursor: pointer;">
    تسجيل دخول الأدمن
</button>

<script>
let isAdmin = false;
const GITHUB_REPO = "اسم_المستخدم/اسم_المستودع"; // قم بتعديلها لمستودعك
const GITHUB_TOKEN_KEY = "github_admin_token";

function toggleAdminMode() {
    let token = localStorage.getItem(GITHUB_TOKEN_KEY);
    if (!token) {
        token = prompt("أدخل رمز الوصول الخاص بك (GitHub Personal Access Token):");
        if (token) {
            localStorage.setItem(GITHUB_TOKEN_KEY, token);
            alert("تم تسجيل الدخول بنجاح!");
            enableAdminFeatures();
        }
    } else {
        enableAdminFeatures();
    }
}

function enableAdminFeatures() {
    isAdmin = true;
    document.getElementById('admin-login-btn').innerText = "وضع التعديل مفعل";
    document.getElementById('admin-login-btn').style.background = "#28a745";
    
    // إظهار أزرار التعديل على كل كارت منتج
    const cards = document.querySelectorAll('.product-card');
    cards.forEach(card => {
        if (!card.querySelector('.edit-btn')) {
            const editBtn = document.createElement('button');
            editBtn.className = 'edit-btn';
            editBtn.innerText = '✏️ تعديل المنتج';
            editBtn.style = 'background: #ffc107; color: #000; border: none; padding: 5px 10px; margin-top: 8px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold;';
            editBtn.onclick = () => editProductDirectly(card);
            card.appendChild(editBtn);
        }
    });
}

async function editProductDirectly(card) {
    const currentTitle = card.querySelector('.product-title').innerText;
    const newTitle = prompt("تعديل اسم المنتج:", currentTitle);
    
    if (newTitle && newTitle !== currentTitle) {
        card.querySelector('.product-title').innerText = newTitle;
        alert(`تم تحديث الاسم إلى: ${newTitle}\nجاري حفظ التغييرات في الموقع...`);
        
        // هنا يتم إرسال التحديث لـ GitHub تلقائياً
        // await saveToGitHub(newTitle);
    }
}
</script>
