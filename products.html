<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات | الأنسياب المتقدم</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-flex">
            <a href="index.html" class="logo-area" style="text-decoration: none; color: inherit;">
                <img src="assets/images/logo.png" alt="شعار الأنسياب المتقدم">
                <div>
                    <h1>الأنسياب المتقدم</h1>
                    <p>لأدوات ولوازم الغاز والرحلات والكشتات</p>
                </div>
            </a>
            <nav class="main-nav">
                <a href="index.html">الرئيسية</a>
                <a href="products.html" class="active">المنتجات</a>
                <a href="about.html">من نحن</a>
                <a href="contact.html">التواصـل</a>
            </nav>
        </div>
    </header>

    <section class="hero" style="padding: 20px 0;">
        <h2 id="page-category-title">جميع المنتجات</h2>
        <p>تصفح منتجاتنا المتنوعة لعالم الغاز والرحلات</p>
    </section>

    <!-- شريط فلترة الأقسام والتنقيل السريع -->
    <section class="search-section" style="margin-bottom: 20px;">
        <div class="container" style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <button onclick="filterCategory('all')" class="filter-btn">الكل</button>
            <button onclick="filterCategory('دوافير الغاز')" class="filter-btn">دوافير الغاز</button>
            <button onclick="filterCategory('مواقد الغاز')" class="filter-btn">مواقد الغاز</button>
            <button onclick="filterCategory('ساعات ومنظمات غاز')" class="filter-btn">ساعات ومنظمات</button>
            <button onclick="filterCategory('ليات غاز ورجلات')" class="filter-btn">ليات ورجلات</button>
            <button onclick="filterCategory('لوازم الرحلات وادواتها')" class="filter-btn">لوازم الرحلات</button>
            <button onclick="filterCategory('خضاضات وسطول ومواعين')" class="filter-btn">خضاضات ومواعين</button>
            <button onclick="filterCategory('قطع غيار')" class="filter-btn">قطع غيار</button>
            <button onclick="filterCategory('محابس وتواصيل غاز')" class="filter-btn">محابس وتواصيل</button>
            <button onclick="filterCategory('دفايات')" class="filter-btn">دفايات</button>
            <button onclick="filterCategory('ولاعات غاز وشعالات كهرباء')" class="filter-btn">ولاعات وشعالات</button>
            <button onclick="filterCategory('ادوات ولوازم كشتات')" class="filter-btn">لوازم كشتات</button>
        </div>
    </section>

    <!-- شبكة عرض المنتجات المجلوبة من Decap CMS -->
    <section class="container" style="margin-bottom: 40px;">
        <div class="grid" id="products-grid">
            <!-- ستظهر المنتجات المجلوبة هنا ديناميكياً -->
            <p style="text-align: center; grid-column: 1 / -1;">جاري تحميل المنتجات...</p>
        </div>
    </section>

    <footer class="footer">
        <p>© 2026 الأنسياب المتقدم - جميع الحقوق محفوظة</p>
    </footer>

    <script>
      // 1. قراءة القسم المحدد من رابط الصفحة (URL Parameter)
      const urlParams = new URLSearchParams(window.location.search);
      const categoryParam = urlParams.get('category');
      const titleElement = document.getElementById('page-category-title');

      if (categoryParam) {
          titleElement.textContent = `منتجات قسم: ${categoryParam}`;
      } else {
          titleElement.textContent = `جميع المنتجات`;
      }

      // 2. دالة التصفية عند الضغط على أزرار الأقسام السريعة
      function filterCategory(catName) {
          if (catName === 'all') {
              window.location.href = 'products.html';
          } else {
              window.location.href = `products.html?category=${encodeURIComponent(catName)}`;
          }
      }

      // 3. دالة جلب وعرض المنتجات (محاكاة الربط مع ملفات Decap CMS)
      async function loadProducts() {
          const grid = document.getElementById('products-grid');
          
          // يمكنك هنا ربط القائمة مع مجلد /content/products المرفوع عبر Decap CMS
          // حالياً نعرض هيكلية جاهزة للمنتجات المصفاة
          grid.innerHTML = `
              <div class="cat-card">
                  <img src="assets/images/logo.png" alt="منتج تجريبي">
                  <h3>منتج تجريبي</h3>
                  <p>القسم: ${categoryParam || 'عام'}</p>
              </div>
          `;
      }

      document.addEventListener('DOMContentLoaded', loadProducts);

      // Netlify Identity
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
</body>
</html>
