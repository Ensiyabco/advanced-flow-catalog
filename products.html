<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتجات والأقسام | الأنسياب المتقدم</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #f8fafc;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .product-card h3 {
      font-size: 16px;
      color: #1b365d;
      margin: 0 0 6px 0;
      font-weight: 800;
    }

    .product-card .cat-name {
      font-size: 12px;
      color: #718096;
      margin-bottom: 4px;
    }

    .product-card .subcat-name {
      font-size: 11px;
      color: #3182ce;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      border-top: 1px solid #edf2f7;
      padding-top: 10px;
    }

    .details-btn {
      background: #2b6cb0;
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      display: inline-block;
    }

    .details-btn:hover {
      background: #1a4971;
    }

    .filter-section {
      margin-bottom: 20px;
      text-align: center;
    }

    .filter-container {
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-btn {
      background: #ffffff;
      border: 1px solid #cbd5e0;
      color: #4a5568;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: #1b365d;
      color: white;
      border-color: #1b365d;
    }

    .subcat-filter-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      background: #f1f5f9;
      padding: 10px;
      border-radius: 8px;
      min-height: 40px;
      align-items: center;
    }

    .sub-filter-btn {
      background: #ffffff;
      border: 1px solid #94a3b8;
      color: #334155;
      padding: 4px 10px;
      border-radius: 15px;
      font-family: 'Cairo', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sub-filter-btn.active, .sub-filter-btn:hover {
      background: #3182ce;
      color: white;
      border-color: #3182ce;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <img src="assets/images/logo.png" alt="شعار المتجر" id="logo-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100%\' height=\'100%\' fill=\'%23edf2f7\'/><text x=\'50%\' y=\'50%\' font-family=\'Cairo\' font-size=\'14\' fill=\'%23a0aec0\' text-anchor=\'middle\' dominant-baseline=\'middle\'>لا توجد صورة</text></svg>'">
      <div class="brand-title">
        <h1>الأنسياب المتقدم</h1>
        <p>أدوات ولوازم الغاز والرحلات</p>
      </div>
    </a>
    <nav class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="products.html" class="active">المنتجات</a>
      <button class="cart-btn-header" onclick="openCartModal()">
        <span>قائمة الطلب</span>
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </nav>
  </header>

  <div class="main-container">
    <h2 style="color:#1b365d; font-weight:900; text-align:center; margin-bottom:20px;">دليل المنتجات والأقسام</h2>
    
    <!-- أزرار الأقسام الرئيسية -->
    <div class="filter-section">
      <div class="filter-container" id="categories-filter">
        <button class="filter-btn active" onclick="filterMainCategory('all', this)">كل المنتجات</button>
        <button class="filter-btn" onclick="filterMainCategory('ادوات لحام ووصواريخ بقاعدة', this)">أدوات اللحام والصواريخ</button>
        <button class="filter-btn" onclick="filterMainCategory('مواقد غاز', this)">مواقد غاز</button>
        <button class="filter-btn" onclick="filterMainCategory('ساعات ومنظمات غاز', this)">ساعات ومنظمات غاز</button>
        <button class="filter-btn" onclick="filterMainCategory('ادوات ولوازم الرحلات', this)">لوازم الرحلات</button>
        <button class="filter-btn" onclick="filterMainCategory('ادوات ولوازم الشواء', this)">لوازم الشواء</button>
      </div>

      <!-- شريط الأقسام الفرعية الديناميكي -->
      <div class="subcat-filter-container" id="subcategories-filter">
        <span style="font-size:12px; color:#64748b; font-weight:700;">اختر القسم الرئيسي لعرض الأقسام الفرعية</span>
      </div>
    </div>

    <div class="products-grid" id="products-grid"></div>
  </div>

  <!-- مودال السلة -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal-card">
      <h3>قائمة الطلبات الخاصة بك</h3>
      <div id="cart-items-container" style="max-height:300px; overflow-y:auto; margin:15px 0;"></div>
      <div class="modal-actions">
        <button style="background:#25d366; color:#fff;" onclick="sendCartToWhatsApp()">إرسال عبر الواتساب</button>
        <button style="background:#e2e8f0; color:#4a5568;" onclick="closeModal('cart-modal')">إلغاء</button>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 الأنسياب المتقدم - جميع الحقوق محفوظة</p>
  </footer>

  <script>
    const defaultProducts = [
      { id: 1, name: "مسدس لحام إيطالي فاخر", mainCat: "ادوات لحام ووصواريخ بقاعدة", subCat: "مسدسات لحام ايطالي", unit: "حبة", boxQty: 6, stock: 50, images: [] },
      { id: 2, name: "صاروخ ايطالي", mainCat: "ادوات لحام ووصواريخ بقاعدة", subCat: "صواريخ وبقاعدة", unit: "حبة", boxQty: 4, stock: 10, images: [] },
      { id: 3, name: "موقد غاز سفري رحلات", mainCat: "مواقد غاز", subCat: "مواقد رحلات", unit: "حبة", boxQty: 10, stock: 10, images: [] },
      { id: 4, name: "منظم غاز إيطالي منزلي", mainCat: "ساعات ومنظمات غاز", subCat: "ساعات غاز منزليه", unit: "حبة", boxQty: 20, stock: 10, images: [] },
      { id: 5, name: "جالون 10 لتر", mainCat: "ادوات ولوازم الرحلات", subCat: "دواوين وسطول", unit: "حبة", boxQty: 6, stock: 10, images: [] },
      { id: 6, name: "منقل ثقيل", mainCat: "ادوات ولوازم الشواء", subCat: "مناقل شوي", unit: "حبة", boxQty: 2, stock: 10, images: [] }
    ];

    let products = JSON.parse(localStorage.getItem('ansiyab_products_v4')) || defaultProducts;
    let cart = JSON.parse(localStorage.getItem('ansiyab_cart')) || [];
    
    let currentMainCat = 'all';
    let currentSubCat = 'all';

    const placeholderSvg = "data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'300\' height=\'200\'><rect width=\'100%\' height=\'100%\' fill=\'%23f1f5f9\'/><text x=\'50%\' y=\'50%\' font-family=\'Cairo\' font-size=\'14\' fill=\'%2394a3b8\' text-anchor=\'middle\' dominant-baseline=\'middle\'>الأنسياب المتقدم</text></svg>";

    document.addEventListener('DOMContentLoaded', function() {
      applyFilters();
      updateCartBadge();
    });

    function filterMainCategory(category, btnElement) {
      document.querySelectorAll('#categories-filter .filter-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      currentMainCat = category;
      currentSubCat = 'all';

      renderSubcategoriesBar(category);
      applyFilters();
    }

    function renderSubcategoriesBar(mainCategory) {
      const subContainer = document.getElementById('subcategories-filter');
      subContainer.innerHTML = '';

      if (mainCategory === 'all') {
        subContainer.innerHTML = '<span style="font-size:12px; color:#64748b; font-weight:700;">اختر القسم الرئيسي لعرض الأقسام الفرعية</span>';
        return;
      }

      // استخراج الأقسام الفرعية التابعة للقسم الرئيسي الحالي فقط
      const matchedProducts = products.filter(p => p.mainCat === mainCategory);
      const subCategories = [...new Set(matchedProducts.map(p => p.subCat).filter(Boolean))];

      if (subCategories.length === 0) {
        subContainer.innerHTML = '<span style="font-size:12px; color:#64748b; font-weight:700;">لا توجد أقسام فرعية مسجلة لهذا القسم</span>';
        return;
      }

      let html = `<button class="sub-filter-btn active" onclick="filterSubCategory('all', this)">كل الأقسام الفرعية</button>`;
      subCategories.forEach(sub => {
        html += `<button class="sub-filter-btn" onclick="filterSubCategory('${sub}', this)">${sub}</button>`;
      });
      subContainer.innerHTML = html;
    }

    function filterSubCategory(subCategory, btnElement) {
      document.querySelectorAll('.sub-filter-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      currentSubCat = subCategory;
      applyFilters();
    }

    function applyFilters() {
      let filtered = products;

      if (currentMainCat !== 'all') {
        filtered = filtered.filter(p => p.mainCat === currentMainCat);
      }

      if (currentSubCat !== 'all') {
        filtered = filtered.filter(p => p.subCat === currentSubCat);
      }

      displayProducts(filtered);
    }

    function displayProducts(prodsToDisplay) {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      if (prodsToDisplay.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#718096; padding:30px;">لا توجد منتجات مطابقة في هذا القسم حالياً.</p>';
        return;
      }

      prodsToDisplay.forEach(prod => {
        let stockQty = prod.stock !== undefined ? prod.stock : 10;
        let badgeHtml = '';

        if (stockQty > 5) {
          badgeHtml = `<span style="font-size:11px; color:#0288d1; font-weight:700;">متوفر (${stockQty})</span>`;
        } else if (stockQty > 0 && stockQty <= 5) {
          badgeHtml = `<span style="font-size:11px; color:#f57c00; font-weight:700;">عدد محدود (${stockQty})</span>`;
        } else {
          badgeHtml = `<span style="font-size:11px; color:#c62828; font-weight:700;">نفذت الكمية</span>`;
        }

        let mainImg = (prod.images && prod.images.length > 0 && prod.images[0].trim() !== '') ? prod.images[0] : placeholderSvg;
        let subCatText = prod.subCat ? `<div class="subcat-name">${prod.subCat}</div>` : '';

        grid.innerHTML += `
          <div class="product-card">
            <div>
              <img src="${mainImg}" alt="${prod.name}" onerror="this.src='${placeholderSvg}'">
              <div class="cat-name">${prod.mainCat}</div>
              ${subCatText}
              <h3>${prod.name}</h3>
            </div>
            <div>
              <div class="card-footer">
                ${badgeHtml}
                <a href="product.html?id=${prod.id}" class="details-btn">التفاصيل</a>
              </div>
            </div>
          </div>
        `;
      });
    }

    function updateCartBadge() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').innerText = totalCount;
    }

    function openCartModal() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = '';
      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#a0aec0;">قائمة الطلب فارغة حالياً</p>';
      } else {
        cart.forEach((item, index) => {
          container.innerHTML += `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #edf2f7;">
              <div>
                <strong>${item.name}</strong><br>
                <small style="color:#718096;">الكمية: ${item.qty} ${item.unit}</small>
              </div>
              <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#e53e3e; cursor:pointer; font-weight:bold;">🗑️</button>
            </div>
          `;
        });
      }
      document.getElementById('cart-modal').style.display = 'flex';
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem('ansiyab_cart', JSON.stringify(cart));
      updateCartBadge();
      openCartModal();
    }

    function sendCartToWhatsApp() {
      if (cart.length === 0) return alert("قائمة الطلب فارغة!");
      let text = "مرحباً، أود طلب المنتجات التالية:\n\n";
      cart.forEach((item, i) => {
        text += `${i+1}- ${item.name} (الكمية: ${item.qty} ${item.unit})\n`;
      });
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }
  </script>
</body>
</html>
