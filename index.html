<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأنسياب المتقدم | أدوات ولوازم الغاز والرحلات</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-flex">
            <a href="index.html" class="logo-area" style="text-decoration: none; color: inherit;">
                <img src="assets/images/logo.png" alt="شعار الأنسياب المتقدم">
                <div>
                    <h1>الأنسياب المتقدم</h1>
                    <p>لأدوات ولوازم الغاز والرحلات والكشتات</p>
                </div>
            </a>
            <nav class="main-nav">
                <a href="index.html" class="active">الرئيسية</a>
                <a href="products.html">المنتجات</a>
                <a href="about.html">من نحن</a>
                <a href="contact.html">التواصـل</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <h2>أفضل أدوات الغاز والرحلات... جودة تعتمد عليها</h2>
        <p>نوفر كل ما تحتاجه للغاز، الشواء، الرحلات، ولوازم الكشتات</p>
    </section>

    <section class="search-section">
        <input type="text" placeholder="ابحث عن منتج في الكتالوج...">
    </section>

    <section id="products" class="categories">
        <h2>تصفح الأقسام</h2>
        <div class="grid" id="categories-grid">
            <!-- سيتم توليد الأقسام التابعة لـ Decap CMS هنا تلقائياً -->
        </div>
    </section>

    <footer class="footer">
        <p>© 2026 الأنسياب المتقدم - جميع الحقوق محفوظة</p>
    </footer>

    <script>
      // قائمة الأقسام الرئيسية والفرعية المعتمدة في Decap CMS
      const categoriesList = [
        { title: "دوافير الغاز", sub: "دوافير ومواقد سفاري", img: "assets/images/logo.png" },
        { title: "مواقد الغاز", sub: "مواقد رحلات وكشتات - مطاعم ومنازل", img: "assets/images/logo.png" },
        { title: "ساعات ومنظمات غاز", sub: "منظمات غاز وتوصيلات", img: "assets/images/logo.png" },
        { title: "ليات غاز ورجلات", sub: "ليات غاز ورجلات", img: "assets/images/logo.png" },
        { title: "لوازم الرحلات وادواتها", sub: "أدوات شواء ولوازم كشتات", img: "assets/images/logo.png" },
        { title: "خضاضات وسطول ومواعين", sub: "خضاضات ومواعين", img: "assets/images/logo.png" },
        { title: "قطع غيار", sub: "قطع غيار ومحابس", img: "assets/images/logo.png" },
        { title: "محابس وتواصيل غاز", sub: "قطع غيار ومحابس", img: "assets/images/logo.png" },
        { title: "دفايات", sub: "دفايات وشعالات", img: "assets/images/logo.png" },
        { title: "ولاعات غاز وشعالات كهرباء", sub: "دفايات وشعالات", img: "assets/images/logo.png" },
        { title: "ادوات ولوازم كشتات", sub: "أدوات شواء ولوازم كشتات", img: "assets/images/logo.png" }
      ];

      const gridContainer = document.getElementById('categories-grid');
      if (gridContainer) {
        gridContainer.innerHTML = categoriesList.map(cat => `
          <div class="cat-card" style="cursor: pointer;" onclick="location.href='products.html?category=${encodeURIComponent(cat.title)}'">
            <img src="${cat.img}" alt="${cat.title}">
            <h3>${cat.title}</h3>
            ${cat.sub ? `<p>${cat.sub}</p>` : ''}
          </div>
        `).join('');
      }

      // إعدادات Netlify Identity للتسجيل
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
</body>
</html>
