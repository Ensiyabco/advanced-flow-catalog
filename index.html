<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الرئيسية | الأنسياب المتقدم</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box !important;
    }

    html, body {
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif !important;
      background-color: #f4f7f9;
      color: #2d3748;
      line-height: 1.6;
    }

    /* الهيدر الجديد مرتب حسب رغبتك (اسم المؤسسة فوق وتحته الأزرار) */
    header {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
      position: sticky;
      top: 0;
      z-index: 1000;
      text-align: center;
    }

    .brand-title {
      margin-bottom: 10px;
    }

    .brand-title h1 {
      font-size: 1.2rem;
      color: #1b365d;
      margin: 0 0 2px 0;
      font-weight: 800;
    }

    .brand-title p {
      font-size: 0.8rem;
      color: #718096;
      margin: 0;
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav-links a, .cart-btn-header {
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 6px;
      background-color: #1b365d;
      transition: all 0.3s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Cairo', sans-serif;
      border: none;
      cursor: pointer;
    }

    .nav-links a.active, .nav-links a:hover, .cart-btn-header:hover {
      background-color: #2b6cb0;
    }

    .cart-badge {
      background-color: #e53e3e;
      color: white;
      border-radius: 50%;
      padding: 2px 6px;
      font-size: 11px;
    }

    /* شاشات الكمبيوتر: يعود الهيدر بجانب بعضه ليكون أنيقاً */
    @media (min-width: 768px) {
      header {
        flex-direction: row;
        justify-content: space-between;
        text-align: right;
        padding: 12px 30px;
      }
      .brand-title {
        margin-bottom: 0;
      }
      .nav-links {
        width: auto;
        justify-content: flex-end;
      }
    }

    .hero-section {
      background: linear-gradient(135deg, #1b365d, #2b6cb0);
      color: white;
      text-align: center;
      padding: 40px 20px;
      margin-bottom: 30px;
    }

    .hero-section h2 {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .hero-section p {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    .search-box {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: none;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
    }

    .search-box button {
      background: #d69e2e;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: 800;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      color: #1b365d;
      margin-bottom: 20px;
      text-align: center;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 40px;
    }

    .cat-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      text-decoration: none;
      color: #2d3748;
      font-weight: 800;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.05);
      color: #2b6cb0;
    }

    .cat-card img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 99999;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .modal-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
    }

    footer {
      background-color: #1b365d;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <h1>الأنسياب المتقدم</h1>
      <p>أدوات ولوازم الغاز والرحلات</p>
    </div>
    <nav class="nav-links">
      <a href="index.html" class="active">الرئيسية</a>
      <a href="products.html">المنتجات</a>
      <button class="cart-btn-header" onclick="openCartModal()">
        <span>قائمة الطلب</span>
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </nav>
  </header>

  <div class="hero-section">
    <h2>أفضل أدوات الغاز والرحلات... جودة تعتمد عليها</h2>
    <p>نوفر كل ما تحتاجه للغاز، الرحلات، الشواء، ولوازم الكشتات بأفضل المواصفات</p>
    <div class="search-box">
      <input type="text" id="home-search-input" placeholder="ابحث عن منتج أو قسم في الكتالوج...">
      <button onclick="performSearch()">بحث</button>
    </div>
  </div>

  <div class="container">
    <div class="section-title">تصفح الأقسام الرئيسية</div>
    <div class="categories-grid" id="home-categories-grid"></div>
  </div>

  <div class="modal-overlay" id="cart-modal">
    <div class="modal-card">
      <h3 style="margin-top:0; color:#1b365d; font-weight:800; text-align:center;">قائمة الطلبات الخاصة بك</h3>
      <div id="cart-items-container" style="max-height:300px; overflow-y:auto; margin:15px 0;"></div>
      <div class="modal-actions">
        <button style="background:#25d366; color:#fff;" onclick="sendCartToWhatsApp()">إرسال عبر الواتساب</button>
        <button style="background:#e2e8f0; color:#4a5568;" onclick="closeModal('cart-modal')">إغلاق</button>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 الأنسياب المتقدم - جميع الحقوق محفوظة</p>
  </footer>

  <script>
    const defaultCategories = [
      { name: "ادوات لحام ووصواريخ بقاعدة", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "مواقد غاز", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "ادوات ولوازم الرحلات", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "ادوات ولوازم الشواء", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "دفايات", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "محابس وتواصيل", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "ساعات ومنظمات غاز", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "ليات غاز", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "ولاعات وشعالات", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "قطع غيار", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "قدور", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "خضاضات وسطول", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "دوافير ودبات", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "طباخات وفوانيس", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "منزليات", image: "https://i.imgur.com/7A26w6i.png" },
      { name: "اكسسوارات عامة", image: "https://i.imgur.com/7A26w6i.png" }
    ];

    let categories = JSON.parse(localStorage.getItem('ansiyab_categories_v3')) || defaultCategories;
    let cart = JSON.parse(localStorage.getItem('ansiyab_cart')) || [];

    document.addEventListener('DOMContentLoaded', function() {
      renderHomeCategories();
      updateCartBadge();
    });

    function renderHomeCategories() {
      const grid = document.getElementById('home-categories-grid');
      grid.innerHTML = '';
      categories.forEach(cat => {
        const a = document.createElement('a');
        a.className = 'cat-card';
        a.href = `products.html?cat=${encodeURIComponent(cat.name)}`;
        a.innerHTML = `
          <img src="${cat.image || 'https://i.imgur.com/7A26w6i.png'}" alt="${cat.name}">
          <div>${cat.name}</div>
        `;
        grid.appendChild(a);
      });
    }

    function performSearch() {
      const query = document.getElementById('home-search-input').value.trim();
      if (query) {
        window.location.href = `products.html?search=${encodeURIComponent(query)}`;
      }
    }

    function updateCartBadge() {
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cart-count').innerText = totalCount;
    }

    function openCartModal() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = '';
      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#a0aec0; padding:20px;">قائمة الطلب فارغة حالياً.</p>';
      } else {
        cart.forEach((item, index) => {
          const row = document.createElement('div');
          row.style.cssText = "display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #f1f5f9; font-size: 13px;";
          row.innerHTML = `
            <div style="font-weight: 700; color: #2d3748;">${index + 1}. ${item.name}</div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="color: #718096; font-weight: 600; font-size: 12px; background: #edf2f7; padding: 3px 8px; border-radius: 4px;">${item.quantity} ${item.unit}</span>
              <button style="background: none; border: none; color: #e53e3e; cursor: pointer; font-size: 14px; font-weight: 700;" onclick="removeFromCart(${item.id}, '${item.unit}')">✕</button>
            </div>
          `;
          container.appendChild(row);
        });
      }
      document.getElementById('cart-modal').style.display = 'flex';
    }

    function removeFromCart(prodId, unit) {
      cart = cart.filter(item => !(item.id === prodId && item.unit === unit));
      localStorage.setItem('ansiyab_cart', JSON.stringify(cart));
      updateCartBadge();
      openCartModal();
    }

    function sendCartToWhatsApp() {
      if (cart.length === 0) {
        alert('قائمة الطلب فارغة!');
        return;
      }
      let message = "السلام عليكم، أرغب في طلب المنتجات التالية:\n\n";
      cart.forEach((item, index) => {
        message += `${index + 1}- ${item.name} | الكمية: ${item.quantity} ${item.unit}\n`;
      });
      message += "\nشكراً لكم.";
      window.open(`https://wa.me/?text=${encodeURIComponent(message)}`);
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }
  </script>
</body>
</html>
