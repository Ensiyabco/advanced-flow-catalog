name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/android-sdk:35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ensiyabco-android-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish Android download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0
          name: تطبيق إنسياب المتقدم لأندرويد 1.0.0
          body: نسخة أندرويد تجريبية لتطبيق إنسياب المتقدم.
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
