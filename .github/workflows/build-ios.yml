name: Build iPhone App

on:
  workflow_dispatch:
  push:
    paths:
      - 'work/ios-app/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPhone simulator
        run: >
          xcodebuild
          -project work/ios-app/EnsiyabcoCatalog.xcodeproj
          -scheme EnsiyabcoCatalog
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
