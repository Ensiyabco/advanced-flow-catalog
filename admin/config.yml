backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/products"
public_folder: "/assets/images/products"

collections:
  - name: "products"
    label: "إدارة المنتجات"
    label_singular: "منتج جديد"
    folder: "content/products"
    create: true
    slug: "{{title}}"
    summary: "{{title}} — [ {{category}} / {{subcategory}} ]"
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string", hint: "اكتب اسم المنتج بوضوح" }
      
      - label: "القسم الرئيسي"
        name: "category"
        widget: "select"
        options:
          - "منزليات"
          - "ادوات ولوازم الرحلات"
          - "ادوات لحام ووصواريخ بقاعدة"
          - "طباخات وفوانيس"
          - "ولاعات وشعالات"
          - "مواقد غاز"
          - "محابس وتواصيل"
          - "ليات غاز"
          - "قطع غيار"
          - "قدور"
          - "ساعات ومنظمات غاز"
          - "دوافير ودبات"
          - "دفايات"
          - "خضاضات وسطول"
          - "ادوات ولوازم الشواء"

      - label: "القسم الفرعي"
        name: "subcategory"
        widget: "select"
        options:
          # منزليات
          - "أدوات منزلية عامة"
          - "أجهزة مطبخ منزلية"
          - "لوازم طهي منزلية"
          
          # ادوات ولوازم الرحلات
          - "جوالين وسطول"
          - "شنط وتجهيزات"
          - "جلسات خارجيه"
          - "زمزميات وقوارير"
          - "اضاءة وانارة"
          
          # ادوات لحام ووصواريخ بقاعدة
          - "مسدسات لحام ايطالي"
          - "مسدسات لحام صيني"
          - "صواريخ بقاعدة"
          - "مسدسات لحام سفري"
          
          # طباخات وفوانيس
          - "طبخات قاز سائل"
          - "فوانيس قاز سائل"
          - "فوانيس بطاريات"
          - "دوافير قاز"
          - "فتايل"
          - "اتاريك"
          - "قزاز فوانيس واتاريك"
          
          # ولاعات وشعالات
          - "ولاعات غاز"
          - "ولاعات بخور"
          - "ولاعات سفري"
          - "شعالات فحم"
          - "قوالب اشعال"
          - "سوائل اشعال"
          
          # مواقد غاز
          - "مواقد غاز منزلية"
          - "مواقد غاز مطاعم"
          - "مواقد غاز مطابخ"
          - "مواقد رحلات"
          - "مواقد كويتي"
          - "مواقد كنافة"
          - "مسطحات تماتيك"
          - "مواقد كهرباء"
          
          # محابس وتواصيل
          - "محابس غاز"
          - "تواصيل غاز"
          - "قسامات وموصلات غاز"
          - "تواصيل ومحولات سفري"
          - "قفزان ليات"
          
          # ليات غاز
          - "ليات غاز منزليه"
          - "ليات غاز مطاعم"
          - "ليات مواقد رحلات"
          
          # قطع غيار
          - "قطع غيار مواقد"
          - "قطع غيار دبات"
          - "قطع غيار دوافير"
          - "قطغ غيار عامه"
          
          # قدور
          - "قدور منزليه"
          - "قدور مطاعم"
          - "قدور عسل"
          - "صواني"
          
          # ساعات ومنظمات غاز
          - "ساعات غاز منزليه"
          - "ساعات غاز مطاعم"
          - "ساعات غاز سفري"
          - "ساعات غاز شبكات"
          - "تحويلاا غاز"
          
          # دوافير ودبات
          - "دبات غاز"
          - "روس دوافير"
          - "روس دوافير بلي"
          - "دبات غاز سفري"
          - "اكسسوارات دوافير"
          
          # دفايات
          - "دفايات قاز"
          - "دفايات غاز"
          - "دفايات كهرباء"
          - "دفايات زيت"
          - "دفايات رحلات"
          - "قطع غيار دفايات"
          
          # خضاضات وسطول
          - "خضاضات لبن"
          - "سطول لبن"
          - "مواعين سمن"
          
          # ادوات ولوازم الشواء
          - "ذرايات وسواتر"
          - "شبوك شوي"
          - "مناقل شوي"
          - "اسياخ شوي"
          - "شنط رحلات"

      - { label: "شد الكرتون / التعبئة", name: "carton_pack", widget: "string", required: false }
      
      - label: "وحدة القياس / البيع"
        name: "unit"
        widget: "select"
        options:
          - "حبة"
          - "كرتون"
          - "ربطة"
          - "درزن"
          - "علبة"
          - "متر"
          - "لفه"

      - { label: "صورة المنتج", name: "image", widget: "image" }
