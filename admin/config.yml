backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/uploads"
public_folder: "assets/images/uploads"

collections:
  # --------------------------------------------------
  # 1. مجموعة المنتجات (Products)
  # --------------------------------------------------
  - name: "products"
    label: "المنتجات"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string" }
      - { label: "صورة المنتج", name: "image", widget: "image" }
      - { label: "السعر", name: "price", widget: "number", value_type: "float", required: false }
      - { label: "الكمية", name: "quantity", widget: "number", required: false }
      - { label: "شد الكرتون", name: "carton_pack", widget: "string", required: false }

      # القسم الرئيسي (تطابق أقسام Decap CMS)
      - label: "القسم الرئيسي"
        name: "category"
        widget: "select"
        options:
          - "دوافير ودبات"
          - "مواقد غاز"
          - "طباخات وفوانيس"
          - "قدور"
          - "ساعات ومنظمات غاز"
          - "ليات غاز"
          - "محابس وتواصيل"
          - "قطع غيار"
          - "خضاضات وسطول"
          - "ولاعات وشعالات"
          - "دفايات"
          - "ادوات ولوازم الشواء"
          - "ادوات ولوازم الرحلات"
          - "ادوات لحام وواريخ"

      - { label: "القسم الفرعي", name: "subcategory", widget: "string", required: false }
      - { label: "وصف المنتج", name: "body", widget: "markdown", required: false }

  # --------------------------------------------------
  # 2. مجموعة إدارة الأقسام (Categories)
  # --------------------------------------------------
  - name: "categories"
    label: "إدارة الأقسام"
    folder: "content/categories"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم القسم", name: "title", widget: "string" }
      - { label: "صورة القسم", name: "image", widget: "image", default: "assets/images/logo.png" }
      - { label: "وصف فرعي/ملاحظات", name: "description", widget: "string", required: false }
