backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/products"
public_folder: "/assets/images/products"

# إعدادات الواجهة باللغة العربية
locale: 'ar'

collections:
  - name: "products"
    label: "إدارة المنتجات"
    label_singular: "منتج جديد"
    folder: "content/products"
    create: true
    slug: "{{title}}"
    # طريقة عرض المنتجات في لوحة التحكم (الاسم + القسم الرئيسي)
    summary: "{{title}} — [ {{category}} / {{subcategory}} ]"
    sortable_fields: ["title", "category"]
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string", hint: "اكتب اسم المنتج بوضوح (مثال: دافور سفري إيطالي)" }
      
      - label: "القسم الرئيسي"
        name: "category"
        widget: "select"
        hint: "اختر القسم الرئيسي المناسب"
        options:
          - "دوافير ودبات"
          - "مواقد غاز"
          - "طباخات وفوانيس"
          - "قدور"
          - "ساعات ومنظمات غاز"
          - "ليات غاز ورجلات"
          - "محابس وتواصيل غاز"
          - "قطع غيار"
          - "خضاضات وسطول ومواعين"
          - "ولاعات غاز وشعالات كهرباء"
          - "دفايات"
          - "ادوات ولوازم كشتات"

      - label: "القسم الفرعي"
        name: "subcategory"
        widget: "select"
        hint: "اختر القسم الفرعي التابع للقسم الرئيسي"
        options:
          # دوافير ودبات
          - "دبات غاز"
          - "روس دوافير"
          - "روس دوافير بلي"
          - "دبات غاز سفري"
          - "اكسسوارات دوافير"
          # مواقد غاز
          - "مواقد غاز منزلية"
          - "مواقد غاز مطاعم"
          - "مواقد غاز مطابخ"
          - "مواقد رحلات"
          - "مواقد كويتي"
          - "مواقد كنافة"
          - "مسطحات تماتيك"
          - "مواقد كهرباء"
          # طباخات وفوانيس
          - "طباخات غاز"
          - "فوانيس إضاءة"
          - "فتائل واكسسوارات"
          # قدور
          - "قدور ضغط"
          - "قدور طهي"
          - "قدور رحلات"
          # ساعات ومنظمات غاز
          - "منظمات غاز إيطالي"
          - "منظمات غاز هندي"
          - "ساعات غاز متغيرة"
          # ليات غاز ورجلات
          - "ليات غاز برتقالي"
          - "ليات غاز مفحوصة"
          - "رجلات غاز"
          # محابس وتواصيل غاز
          - "محابس غاز نحاس"
          - "توصيلات غاز"
          - "سنن وتحويلات"
          # قطع غيار
          - "قطع غيار دوافير"
          - "قطع غيار مواقد"
          - "جلد وجلب غاز"
          # خضاضات وسطول ومواعين
          - "خضاضات لبن"
          - "سطول ومواعين رحلات"
          # ولاعات غاز وشعالات كهرباء
          - "ولاعات غاز طويلة"
          - "شعالات كهربائية"
          # دفايات
          - "دفايات غاز رحلات"
          - "دفايات غاز منازل"
          # ادوات ولوازم كشتات
          - "شوايات رحلات"
          - "شبك وأدوات شواء"
          - "خيام وكراسي"
          - "لوازم كشتات عامة"

      - { label: "شد الكرتون / التعبئة", name: "carton_pack", widget: "string", required: false, hint: "مثال: 24 حبة أو اختياري" }
      - { label: "صورة المنتج", name: "image", widget: "image", hint: "قم برفع صورة المنتجات بجودة مناسبة" }
