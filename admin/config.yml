backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/products"
public_folder: "/assets/images/products"

collections:
  # --------------------------------------------------
  # 1. إدارة الأقسام
  # --------------------------------------------------
  - name: "categories"
    label: "إدارة الأقسام"
    folder: "content/categories"
    create: true
    slug: "{{main_category}}"
    identifier_field: "main_category"
    fields:
      - { label: "اسم القسم الرئيسي", name: "main_category", widget: "string" }
      - label: "الأقسام الفرعية التابعة له"
        name: "subcategories"
        widget: "list"
        required: false
        field: { label: "اسم القسم الفرعي", name: "subcategory_name", widget: "string" }

  # --------------------------------------------------
  # 2. المنتجات
  # --------------------------------------------------
  - name: "products"
    label: "المنتجات"
    folder: "content/products"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string" }
      
      - label: "القسم الرئيسي"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["main_category"]
        value_field: "main_category"
        display_fields: ["main_category"]

      - label: "القسم الفرعي"
        name: "subcategory"
        widget: "relation"
        collection: "categories"
        search_fields: ["subcategories"]
        value_field: "subcategories.*"
        display_fields: ["subcategories.*"]
        required: false

      - { label: "السعر (ر.س)", name: "price", widget: "number", value_type: "float", required: false }
      - { label: "الكمية المتاحة", name: "quantity", widget: "number", value_type: "int", required: false, hint: "إجمالي عدد القطع أو الكراتين المتوفرة" }
      - { label: "شد الكرتون (عدد الحبات)", name: "carton_pack", widget: "string", required: false, hint: "مثال: 12 حبة، 24 حبة" }
      - { label: "صورة المنتج", name: "image", widget: "image" }
      - { label: "وصف المنتج", name: "body", widget: "markdown", required: false }
