backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/uploads"
public_folder: "assets/images/uploads"

collections:
  # --------------------------------------------------
  # 1. مجموعة المنتجات (Products Collection)
  # --------------------------------------------------
  - name: "products"
    label: "المنتجات"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string" }
      - { label: "صورة المنتج", name: "image", widget: "image" }
      - { label: "السعر", name: "price", widget: "number", value_type: "float", required: false }
      - { label: "الكمية", name: "quantity", widget: "number", required: false }
      - { label: "شد الكرتون", name: "carton_pack", widget: "string", required: false }

      # القسم الرئيسي
      - label: "القسم الرئيسي"
        name: "category"
        widget: "select"
        options:
          - "دوافير الغاز"
          - "مواقد الغاز"
          - "ساعات ومنظمات غاز"
          - "ليات غاز ورجلات"
          - "لوازم الرحلات وادواتها"
          - "خضاضات وسطول ومواعين"
          - "قطع غيار"
          - "محابس وتواصيل غاز"
          - "دفايات"
          - "ولاعات غاز وشعالات كهرباء"
          - "ادوات ولوازم كشتات"

      # القسم الفرعي
      - label: "القسم الفرعي"
        name: "subcategory"
        widget: "select"
        required: false
        options:
          - "دوافير ومواقد سفاري"
          - "مواقد رحلات وكشتات"
          - "مواقد مطاعم ومنازل"
          - "منظمات غاز وتوصيلات"
          - "ليات غاز ورحلات"
          - "خضاضات ومواعين"
          - "قطع غيار ومحابس"
          - "دفايات وشعالات"
          - "أدوات شواء ولوازم كشتات"

      - { label: "وصف المنتج", name: "body", widget: "markdown", required: false }

  # --------------------------------------------------
  # 2. مجموعة إدارة الأقسام (Categories Collection)
  # --------------------------------------------------
  - name: "categories"
    label: "إدارة الأقسام"
    folder: "content/categories"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم القسم", name: "title", widget: "string" }
      - { label: "صورة القسم", name: "image", widget: "image", default: "assets/images/logo.png" }
      - { label: "وصف القسم الفرعي", name: "description", widget: "string", required: false }
