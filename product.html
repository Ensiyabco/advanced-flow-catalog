<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج | الأنسياب المتقدم</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .product-detail-box {
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            margin: 15px 0;
            text-align: center;
            border: 1px solid #edf2f7;
        }
        .info-item label {
            display: block;
            font-size: 11px;
            color: #718096;
        }
        .info-item span {
            font-weight: bold;
            font-size: 13px;
        }
        .qty-unit-group {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }
        .qty-unit-group input, .qty-unit-group select {
            padding: 8px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
        }
        .btn-whatsapp {
            display: block;
            width: 100%;
            text-align: center;
            background: #25D366;
            color: white;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-flex">
            <div class="logo-area">
                <img src="assets/images/logo.png" alt="الأنسياب المتقدم">
                <div>
                    <h1>الأنسياب المتقدم</h1>
                    <p>لوازم الغاز والرحلات</p>
                </div>
            </div>
            <nav class="main-nav">
                <a href="index.html">الرئيسية</a>
                <a href="products.html">المنتجات</a>
                <a href="about.html">من نحن</a>
                <a href="contact.html">التواصل</a>
            </nav>
        </div>
    </header>

    <section class="about">
        <h2>تفاصيل المنتج</h2>
        <div class="product-detail-box">
            <img src="assets/images/logo.png" alt="صورة المنتج" style="width:100%; height:auto; max-height:300px; object-fit:contain;">
            <h3 id="prod-title" style="margin-top: 15px;">دافور غاز سفري فاخر</h3>
            <p>وصف تفصيلي للمنتج، يتميز بالجودة العالية وسهولة الحمل والاستخدام المباشر في الرحلات.</p>

            <!-- جدول معلومات الوحدات والمخزن -->
            <div class="info-grid">
                <div class="info-item">
                    <label>الوحدة الافتراضية</label>
                    <span id="default-unit">حبة</span>
                </div>
                <div class="info-item">
                    <label>شد الكرتون</label>
                    <span id="box-qty">12 حبة</span>
                </div>
                <div class="info-item">
                    <label>المخزن المتوفر</label>
                    <span id="stock-count" style="color: #2b6cb0;">50 حبة</span>
                </div>
            </div>

            <!-- تحديد الكمية والوحدة قبل الطلب -->
            <div class="qty-unit-group">
                <label style="font-size: 13px; font-weight: bold;">الكمية المطلوب طلبها:</label>
                <input type="number" id="order-qty" value="1" min="1" style="width: 70px;">
                <select id="order-unit" style="flex: 1;">
                    <option value="حبة">حبة</option>
                    <option value="كرتون">كرتون (12 حبة)</option>
                    <option value="علبة">علبة</option>
                    <option value="درزن">درزن</option>
                    <option value="ربطة">ربطة</option>
                    <option value="لفة">لفة</option>
                </select>
            </div>

            <!-- زر الطلب المباشر عبر الواتساب -->
            <button onclick="sendSingleProductWhatsApp()" class="btn-whatsapp" style="border:none; cursor:pointer;">طلب هذا المنتج عبر الواتساب 💬</button>
        </div>
    </section>

    <footer class="footer">
        <p>© 2026 الأنسياب المتقدم — جميع الحقوق محفوظة</p>
    </footer>

    <script>
        const targetPhoneNumber = "966506645562";

        function sendSingleProductWhatsApp() {
            const title = document.getElementById('prod-title').innerText;
            const qty = document.getElementById('order-qty').value || 1;
            const unit = document.getElementById('order-unit').value;

            const message = `السلام عليكم ورحمة الله وبركاته،\nأود طلب المنتج التالي من مؤسسة الأنسياب المتقدم:\n\n- المنتج: ${title}\n- الكمية المطلوبة: ${qty} ${unit}\n\nيرجى تأكيد التوفر وإرسال تفاصيل السعر والشحن. شكراً لكم!`;

            const encodedMsg = encodeURIComponent(message);
            window.open(`https://wa.me/${targetPhoneNumber}?text=${encodedMsg}`, '_blank');
        }
    </script>
</body>
</html>
