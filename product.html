<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج | الأنسياب المتقدم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <img src="assets/images/logo.png" alt="شعار المتجر" id="logo-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'50\' height=\'50\'><rect width=\'100%\' height=\'100%\' fill=\'%23edf2f7\'/><text x=\'50%\' y=\'50%\' font-family=\'Cairo\' font-size=\'10\' fill=\'%23a0aec0\' text-anchor=\'middle\' dominant-baseline=\'middle\'>شعار</text></svg>'">
      <div class="brand-title">
        <h1>الأنسياب المتقدم</h1>
        <p>أدوات ولوازم الغاز والرحلات</p>
      </div>
    </a>
    <nav class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="products.html">المنتجات</a>
      <button class="cart-btn-header" onclick="openCartModal()">
        <span>قائمة الطلب</span>
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </nav>
  </header>

  <main class="main-container">
    <div class="product-details-card" id="product-details-container">
      <!-- يتم تحميل بيانات المنتج هنا ديناميكياً -->
    </div>
  </main>

  <!-- مودال السلة -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal-card">
      <h3>قائمة الطلبات</h3>
      <div id="cart-items-container" style="max-height:250px; overflow-y:auto; margin:15px 0;"></div>
      <div class="modal-actions">
        <button style="background:#25d366; color:#fff;" onclick="sendCartToWhatsApp()">إرسال للواتساب</button>
        <button style="background:#e2e8f0; color:#4a5568;" onclick="closeModal('cart-modal')">إغلاق</button>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 الأنسياب المتقدم - جميع الحقوق محفوظة</p>
  </footer>

  <script>
    const defaultProducts = [
      { id: 1, name: "مسدس لحام إيطالي فاخر", mainCat: "ادوات لحام ووصواريخ بقاعدة", subCat: "مسدسات لحام ايطالي", unit: "حبة", boxQty: 6, stock: 8, images: [] },
      { id: 2, name: "موقد غاز سفري رحلات", mainCat: "مواقد غاز", subCat: "مواقد رحلات", unit: "حبة", boxQty: 10, stock: 3, images: [] }
    ];

    let products = JSON.parse(localStorage.getItem('ansiyab_products_v4')) || defaultProducts;
    let cart = JSON.parse(localStorage.getItem('ansiyab_cart')) || [];
    let customSubCategories = JSON.parse(localStorage.getItem('ansiyab_custom_subcats')) || {};

    const urlParams = new URLSearchParams(window.location.search);
    const productId = parseInt(urlParams.get('id')) || 1;
    const currentProduct = products.find(p => p.id === productId) || products[0];

    document.addEventListener('DOMContentLoaded', () => {
      renderProductDetails();
      updateCartBadge();
    });

    function renderProductDetails() {
      const container = document.getElementById('product-details-container');
      let stockBadgeClass = currentProduct.stock > 0 ? 'badge-available' : 'badge-out-of-stock';
      let stockText = currentProduct.stock > 0 ? `متوفر في المخزن (${currentProduct.stock})` : 'نفذت الكمية';

      container.innerHTML = `
        <div class="product-gallery-section">
          <div class="main-img-container">
            <span style="color:#a0aec0;">صورة المنتج الرئيسية</span>
          </div>
        </div>
        <div class="product-info-section">
          <div class="product-category-path">${currentProduct.mainCat} / ${currentProduct.subCat || 'عام'}</div>
          <h1 class="product-title">${currentProduct.name}</h1>
          <div class="stock-badge ${stockBadgeClass}">${stockText}</div>
          
          <div class="product-specs-table">
            <div class="spec-item"><label>وحدة البيع</label><span>${currentProduct.unit || 'حبة'}</span></div>
            <div class="spec-item"><label>شد الكرتون</label><span>${currentProduct.boxQty || 1}</span></div>
          </div>

          <div class="quantity-control">
            <label style="font-weight:700;">الكمية المطلوبة:</label>
            <input type="number" id="qty-input" value="1" min="1" max="${currentProduct.stock || 100}">
          </div>

          <button class="add-to-cart-btn" onclick="addToCart()" ${currentProduct.stock === 0 ? 'disabled' : ''}>إضافة إلى قائمة الطلب</button>
        </div>
      `;
    }

    function addToCart() {
      let qty = parseInt(document.getElementById('qty-input').value) || 1;
      let existingItem = cart.find(item => item.id === currentProduct.id);
      if (existingItem) {
        existingItem.qty += qty;
      } else {
        cart.push({ id: currentProduct.id, name: currentProduct.name, qty: qty, unit: currentProduct.unit || 'حبة' });
      }
      localStorage.setItem('ansiyab_cart', JSON.stringify(cart));
      updateCartBadge();
      openCartModal();
    }

    function openCartModal() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = cart.length === 0 ? '<p style="text-align:center; color:#a0aec0;">قائمة الطلب فارغة</p>' : '';
      cart.forEach((item, i) => {
        container.innerHTML += `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #edf2f7;"><span>${item.name} (${item.qty})</span><button onclick="removeFromCart(${i})" style="background:none; border:none; color:red; cursor:pointer;">حذف</button></div>`;
      });
      document.getElementById('cart-modal').style.display = 'flex';
    }

    function removeFromCart(i) {
      cart.splice(i, 1);
      localStorage.setItem('ansiyab_cart', JSON.stringify(cart));
      updateCartBadge();
      openCartModal();
    }

    function updateCartBadge() {
      document.getElementById('cart-count').innerText = cart.reduce((s, i) => s + i.qty, 0);
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function sendCartToWhatsApp() {
      if (cart.length === 0) return alert("السلة فارغة");
      let msg = "طلب جديد:\n" + cart.map(i => `- ${i.name} (${i.qty})`).join('\n');
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }
  </script>
</body>
</html>
