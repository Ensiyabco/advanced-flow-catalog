<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج | الأنسياب المتقدم</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <img src="assets/images/logo.png" alt="شعار المتجر" id="logo-img" onerror="this.src='https://i.imgur.com/7A26w6i.png'">
      <div class="brand-title">
        <h1>الأنسياب المتقدم</h1>
        <p>أدوات ولوازم الغاز والرحلات</p>
      </div>
    </a>
    <nav class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="products.html">المنتجات</a>
      <button class="cart-btn-header" onclick="openCartModal()">
        <span>قائمة الطلب</span>
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </nav>
  </header>

  <div class="main-container">
    <div id="product-details-container">
      <!-- يتم حقن تفاصيل المنتج هنا ديناميكياً -->
    </div>
  </div>

  <!-- مودال السلة -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal-card">
      <h3>قائمة الطلبات الخاصة بك</h3>
      <div id="cart-items-container" style="max-height:300px; overflow-y:auto; margin:15px 0;"></div>
      <div class="modal-actions">
        <button style="background:#25d366; color:#fff;" onclick="sendCartToWhatsApp()">إرسال عبر الواتساب</button>
        <button style="background:#e2e8f0; color:#4a5568;" onclick="closeModal('cart-modal')">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة تكبير الصور (Lightbox) -->
  <div class="image-lightbox-overlay" id="image-lightbox" onclick="closeLightbox()">
    <div class="image-lightbox-content" onclick="event.stopPropagation()">
      <button class="lightbox-close-btn" onclick="closeLightbox()">✕</button>
      <button class="lightbox-nav-btn lightbox-prev" onclick="changeLightboxImage(-1)">&#10095;</button>
      <img id="lightbox-img-src" src="" alt="صورة مكبرة">
      <button class="lightbox-nav-btn lightbox-next" onclick="changeLightboxImage(1)">&#10094;</button>
      <p id="lightbox-title" style="margin-top:10px; font-weight:800; color:#1b365d; text-align:center;"></p>
    </div>
  </div>

  <footer>
    <p>© 2026 الأنسياب المتقدم - جميع الحقوق محفوظة</p>
  </footer>

  <script>
    const defaultProducts = [
      { id: 1, name: "مسدس لحام إيطالي فاخر", mainCat: "ادوات لحام ووصواريخ بقاعدة", subCat: "مسدسات لحام ايطالي", unit: "حبة", boxQty: 6, stock: 8, images: ["https://i.imgur.com/7A26w6i.png"] },
      { id: 2, name: "موقد غاز سفري رحلات", mainCat: "مواقد غاز", subCat: "مواقد رحلات", unit: "حبة", boxQty: 10, stock: 3, images: ["https://i.imgur.com/7A26w6i.png"] },
      { id: 3, name: "منظم غاز إيطالي منزلي", mainCat: "ساعات ومنظمات غاز", subCat: "ساعات غاز منزليه", unit: "حبة", boxQty: 20, stock: 0, images: ["https://i.imgur.com/7A26w6i.png"] }
    ];

    let products = JSON.parse(localStorage.getItem('ansiyab_products_v4')) || defaultProducts;
    let cart = JSON.parse(localStorage.getItem('ansiyab_cart')) || [];

    let currentLightboxImages = [];
    let currentLightboxIndex = 0;
    let currentLightboxTitle = "";

    document.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const prodId = parseInt(urlParams.get('id')) || 1;
      const product = products.find(p => p.id === prodId) || products[0];
      renderProductDetails(product);
      updateCartBadge();
    });

    function renderProductDetails(prod) {
      const container = document.getElementById('product-details-container');
      
      let images = prod.images && prod.images.length > 0 ? prod.images : ['https://i.imgur.com/7A26w6i.png'];
      const mainImg = images[0];

      let thumbsHtml = '';
      if (images.length > 1) {
        thumbsHtml = `<div class="product-thumbnails">`;
        images.forEach((img, idx) => {
          thumbsHtml += `<img src="${img}" class="thumb-img ${idx === 0 ? 'active-thumb' : ''}" onclick="changeMainImage('${img}', this)">`;
        });
        thumbsHtml += `</div>`;
      }

      let stockQty = prod.stock !== undefined ? prod.stock : 10;
      let stockHtml = '';
      let isOutOfStock = false;

      if (stockQty > 5) {
        stockHtml = `<div class="stock-badge badge-available">متوفر بالمخزن (${stockQty} قطع متاحة)</div>`;
      } else if (stockQty > 0 && stockQty <= 5) {
        stockHtml = `<div class="stock-badge badge-low-stock">باقي عدد محدود (${stockQty} قطع فقط)</div>`;
      } else {
        stockHtml = `<div class="stock-badge badge-out-of-stock">نفذت الكمية</div>`;
        isOutOfStock = true;
      }

      container.innerHTML = `
        <div class="product-details-card">
          <div class="product-gallery-section">
            <div class="main-img-container" onclick="openLightbox(${prod.id})" title="اضغط لتكبير الصور">
              <img id="active-product-img" src="${mainImg}" alt="${prod.name}" onerror="this.src='https://i.imgur.com/7A26w6i.png'">
            </div>
            ${thumbsHtml}
          </div>

          <div class="product-info-section">
            <div class="product-category-path">${prod.mainCat} ${prod.subCat ? ' / ' + prod.subCat : ''}</div>
            <div class="product-title">${prod.name}</div>
            
            ${stockHtml}

            <div class="product-specs-table">
              <div class="spec-item"><label>وحدة القياس</label><span>${prod.unit || 'حبة'}</span></div>
              <div class="spec-item"><label>شد الكرتون</label><span>${prod.boxQty || 1}</span></div>
            </div>

            <div class="quantity-control">
              <label>الكمية:</label>
              <input type="number" id="product-qty" value="1" min="1" ${isOutOfStock ? 'disabled' : ''}>
              <select id="product-unit" ${isOutOfStock ? 'disabled' : ''}>
                <option value="حبة" ${prod.unit === 'حبة' ? 'selected' : ''}>حبة</option>
                <option value="علبة" ${prod.unit === 'علبة' ? 'selected' : ''}>علبة</option>
                <option value="كرتون" ${prod.unit === 'كرتون' ? 'selected' : ''}>كرتون</option>
                <option value="درزن" ${prod.unit === 'درزن' ? 'selected' : ''}>درزن</option>
                <option value="لفة" ${prod.unit === 'لفة' ? 'selected' : ''}>لفة</option>
                <option value="متر" ${prod.unit === 'متر' ? 'selected' : ''}>متر</option>
                <option value="ربطة" ${prod.unit === 'ربطة' ? 'selected' : ''}>ربطة</option>
                <option value="بالة" ${prod.unit === 'بالة' ? 'selected' : ''}>بالة</option>
              </select>
            </div>

            <button class="add-to-cart-btn" id="add-to-cart-btn" onclick="addCurrentProductToCart(${prod.id}, '${prod.name}')" ${isOutOfStock ? 'disabled' : ''}>
              ${isOutOfStock ? 'المنتج غير متوفر حالياً (نفذت الكمية)' : 'إضافة إلى قائمة الطلب'}
            </button>
          </div>
        </div>
      `;
    }

    function changeMainImage(imgSrc, thumbElement) {
      document.getElementById('active-product-img').src = imgSrc;
      document.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active-thumb'));
      thumbElement.classList.add('active-thumb');
    }

    function openLightbox(prodId) {
      const urlParams = new URLSearchParams(window.location.search);
      const prodIdParam = parseInt(urlParams.get('id')) || prodId;
      const prod = products.find(p => p.id === prodIdParam) || products[0];

      currentLightboxImages = prod.images && prod.images.length > 0 ? prod.images : ['https://i.imgur.com/7A26w6i.png'];
      currentLightboxTitle = prod.name;

      const activeSrc = document.getElementById('active-product-img').src;
      currentLightboxIndex = currentLightboxImages.indexOf(activeSrc);
      if (currentLightboxIndex === -1) currentLightboxIndex = 0;

      updateLightboxDisplay();
      document.getElementById('image-lightbox').style.display = 'flex';
    }

    function updateLightboxDisplay() {
      document.getElementById('lightbox-img-src').src = currentLightboxImages[currentLightboxIndex];
      document.getElementById('lightbox-title').innerText = `${currentLightboxTitle} (${currentLightboxIndex + 1} من ${currentLightboxImages.length})`;
    }

    function changeLightboxImage(direction) {
      currentLightboxIndex += direction;
      if (currentLightboxIndex >= currentLightboxImages.length) {
        currentLightboxIndex = 0;
      } else if (currentLightboxIndex < 0) {
        currentLightboxIndex = currentLightboxImages.length - 1;
      }
      updateLightboxDisplay();
    }

    function closeLightbox() {
      document.getElementById('image-lightbox').style.display = 'none';
    }

    function addCurrentProductToCart(id, name) {
      const qty = parseInt(document.getElementById('product-qty').value) || 1;
      const unit = document.getElementById('product-unit').value;

      const existing = cart.find(item => item.id === id && item.unit === unit);
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({ id, name, qty, unit });
      }
      saveCartData();
      updateCartBadge();
      alert("تمت إضافة المنتج إلى قائمة الطلب بنجاح!");
    }

    function updateCartBadge() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').innerText = totalCount;
    }

    function saveCartData() {
      localStorage.setItem('ansiyab_cart', JSON.stringify(cart));
    }

    function openCartModal() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = '';
      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#a0aec0;">قائمة الطلب فارغة حالياً</p>';
      } else {
        cart.forEach((item, index) => {
          container.innerHTML += `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #edf2f7;">
              <div>
                <strong>${item.name}</strong><br>
                <small style="color:#718096;">الكمية: ${item.qty} ${item.unit}</small>
              </div>
              <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#e53e3e; cursor:pointer; font-weight:bold;">🗑️</button>
            </div>
          `;
        });
      }
      document.getElementById('cart-modal').style.display = 'flex';
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      saveCartData();
      updateCartBadge();
      openCartModal();
    }

    function sendCartToWhatsApp() {
      if (cart.length === 0) return alert("قائمة الطلب فارغة!");
      let text = "مرحباً، أود طلب المنتجات التالية:\n\n";
      cart.forEach((item, i) => {
        text += `${i+1}- ${item.name} (الكمية: ${item.qty} ${item.unit})\n`;
      });
      const encoded = encodeURIComponent(text);
      window.open(`https://wa.me/?text=${encoded}`, '_blank');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }
  </script>
</body>
</html>
